                pending.sort((a, b) => dayjs(a.pickupDate).valueOf() - dayjs(b.pickupDate).valueOf());
                transit.sort((a, b) => dayjs(a.pickupDate).valueOf() - dayjs(b.pickupDate).valueOf());
                preOrders.sort((a, b) => dayjs(a.reminderDate).valueOf() - dayjs(b.reminderDate).valueOf());

                setPendingDispatch(pending);
                setInTransit(transit);
                setPendingPreOrders(preOrders);
                setDraftOrders(data.filter(o => o.isDraft));
            };

            // ---- 总览 v8：KPI 卡片行 + 状态看板（预定单与草稿合并为一列，无小色点） ----
            const fmtMD = (v) => (v ? dayjs(v).format('MM-DD') : '-');

            const ICO = { mixed: 'RocketOutlined', pending: 'ClockCircleOutlined', transit: 'CarOutlined' };

            const groups = [
                { key: 'mixed',   dot: '#ef4444', label: '预定单 / 草稿', items: pendingPreOrders.map(o => ({ ...o, _st: 'pre' })).concat(draftOrders.map(o => ({ ...o, _st: 'draft' }))) },
                { key: 'pending', dot: '#f59e0b', label: '准备派车',      items: pendingDispatch.map(o => ({ ...o, _st: 'pending' })) },
                { key: 'transit', dot: '#10b981', label: '运输中',        items: inTransit.map(o => ({ ...o, _st: 'transit' })) }
            ];
            const total = groups.reduce((s, g) => s + g.items.length, 0);
            const mixedCount = pendingPreOrders.length + draftOrders.length;

            const summary = total === 0 ? '暂无待办，所有单都在正常推进中'
                : (pendingDispatch.length > 0 ? '今天有 ' + pendingDispatch.length + ' 单需要安排派车'
                    : (mixedCount > 0 ? mixedCount + ' 单预定单/草稿待处理'
                        : inTransit.length + ' 单在途运输中，无需操作'));

            const orderNo = (o) => o.shipmentId || o.poNumber || '未填单号';
            const goOrder = (o) => {
                if (o._st === 'draft') { if (onEditOrder) onEditOrder(o); }
                else { onNavigate('5'); if (onHighlightOrder) onHighlightOrder(o.id); }
            };

            return (
                <div style={{ padding: '0 2px' }}>
                    <div className="page-head">
                        <div className="page-head-l">
                            <div className="page-title"><span className="pi">{React.createElement(icons.DashboardOutlined)}</span>总览</div>
                            <div className="page-sub">{summary}</div>
                        </div>
                    </div>

                    <div className="ov-kpis">
                        {groups.map(g => (
                            <div key={g.key} className={'ov-kpi' + (g.items.length === 0 ? ' zero' : '')} onClick={() => onNavigate('5')} title={'查看' + g.label}>
                                <div className="ov-kpi-top">
                                    <span className="ov-kpi-ico" style={{ color: g.dot, background: g.dot + '1a' }}>{React.createElement(icons[ICO[g.key]])}</span>
                                    <span className="ov-kpi-num">{g.items.length}</span>
                                </div>
                                <div className="ov-kpi-label">{g.label}</div>
                            </div>
                        ))}
                    </div>

                    {total === 0 ? (
                        <div className="ov-panel">
                            <div className="ov-empty">
                                <div className="ov-empty-ico">{React.createElement(icons.CheckCircleFilled)}</div>
                                <div className="ov-empty-t">目前没有需要处理的派车单</div>
                                <div className="ov-empty-s">所有单都在正常推进中</div>
                                <Button type="primary" onClick={() => onNavigate('4')}>去生成派车单</Button>
                            </div>
                        </div>
                    ) : (
                        <div className="ov-board">
                            {groups.map(g => (
                                <div key={g.key} className="ov-col">
                                    <div className="ov-col-h">
                                        <span className="ov-col-name">{g.label}</span>
                                        <span className="ov-col-n">{g.items.length}</span>
                                    </div>
                                    <div className="ov-col-body">
                                        {g.items.length === 0 ? (
                                            <div className="ov-col-empty">暂无</div>
                                        ) : g.items.map(o => (
                                            <div key={o.id} className="ov-card" onClick={() => { var s = window.getSelection ? String(window.getSelection()).trim() : ""; if (s) return; goOrder(o); }} title="点击查看">
                                                <div className="ov-card-h">
                                                    <span className="ov-card-no" onClick={(e) => e.stopPropagation()} title="拖选可复制单号">{orderNo(o)}</span>
                                                </div>
                                                <div className="ov-card-route">{o.routeName || '-'}</div>
                                                <div className="ov-card-meta">
                                                    <span>{fmtMD(o.pickupDate)} → {fmtMD(o.deliveryDate)}</span>
                                                    <span className="ov-card-fleet">{o.fleet || '-'}</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        // 7. 数据分析与财务统计组件 (新增)
        const DataAnalysis = () => {
            const [orders, setOrders] = useState([]);
            const [fleetStats, setFleetStats] = useState([]);
            const [monthlyStats, setMonthlyStats] = useState([]);
            const [year, setYear] = useState(dayjs().year());

            useEffect(() => {
                const allOrders = getOrders();
                setOrders(allOrders);
                calculateStats(allOrders, year);
            }, [year]);

            const calculateStats = (data, selectedYear) => {
                const fleetMap = {};
                const monthMap = {};
                
                // 初始化 1-12 月
                for (let i = 1; i <= 12; i++) {
                     const monthKey = `${selectedYear}-${String(i).padStart(2, '0')}`;
                     monthMap[monthKey] = {
                         month: `${i}月`,
                         count: 0,
                         totalWeight: 0,
                         totalCbm: 0,
                         totalItems: 0
                     };
                 }

                data.forEach(order => {
                    if (!order.pickupDate) return;
                    const date = dayjs(order.pickupDate);
                    if (date.year() !== selectedYear) return;

                    const monthKey = date.format('YYYY-MM');
                    
                    // 月度货量统计
                    if (monthMap[monthKey]) {
                        monthMap[monthKey].count += 1;
                        monthMap[monthKey].totalWeight += Number(order.cargoWeight) || 0;
                        monthMap[monthKey].totalCbm += Number(order.cargoCbm) || 0;
                        monthMap[monthKey].totalItems += Number(order.cargoCount) || 0;
                    }

                    // 车队统计
                    if (order.fleet) {
                        if (!fleetMap[order.fleet]) {
                            fleetMap[order.fleet] = { fleet: order.fleet, usageCount: 0, totalOrders: 0 };
                        }
                        fleetMap[order.fleet].usageCount += 1;
                        fleetMap[order.fleet].totalOrders += 1;
                    }
                });

                setMonthlyStats(Object.values(monthMap));
                setFleetStats(Object.values(fleetMap).sort((a, b) => b.usageCount - a.usageCount));
            };

            const fleetColumns = [
                { title: '承运车队', dataIndex: 'fleet', key: 'fleet', render: t => <Text strong>{t}</Text> },
                { title: '派车次数', dataIndex: 'usageCount', key: 'usageCount', sorter: (a, b) => a.usageCount - b.usageCount }
            ];

            const monthColumns = [
                { title: '月份', dataIndex: 'month', key: 'month', render: t => <Text strong>{t}</Text> },
                { title: '发货单数', dataIndex: 'count', key: 'count' },
                { title: '总件数', dataIndex: 'totalItems', key: 'totalItems' },
                { title: '总重量 (KG)', dataIndex: 'totalWeight', key: 'totalWeight', render: val => val.toFixed(2) },
                { title: '总体积 (CBM)', dataIndex: 'totalCbm', key: 'totalCbm', render: val => val.toFixed(2) }
            ];

            return (
                <div>
                    <div className="page-head">
                        <div className="page-head-l">
                            <div className="page-title"><span className="pi">{React.createElement(icons.BarChartOutlined)}</span>数据分析</div>
                            <div className="page-sub">运力车队与月度货量统计</div>
                        </div>
                        <div className="page-actions">
                            <Select 
                                value={year} 
                                onChange={setYear} 
                                style={{ width: 120 }} 
                                size="large"
                                options={[
                                    { value: dayjs().year() + 1, label: `${dayjs().year() + 1}年` },
                                    { value: dayjs().year(), label: `${dayjs().year()}年` },
                                    { value: dayjs().year() - 1, label: `${dayjs().year() - 1}年` }
                                ]}
                            />
                        </div>
                    </div>

                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 24 }}>
                        <Card 
                            title={<><span style={{marginRight: 8, color: 'var(--pri)'}}>{React.createElement(icons.CarOutlined)}</span>运力 / 车队统计</>} 
                            bordered={false}
                        >
                            <Table 
                                dataSource={fleetStats} 
                                columns={fleetColumns} 
                                rowKey="fleet" 
                                pagination={{ pageSize: 5 }} 
                                size="middle"
                            />
                        </Card>

                        <Card 
                            title={<><span style={{marginRight: 8, color: 'var(--pri)'}}>{React.createElement(icons.InboxOutlined)}</span>货量月度总结 ({year}年)</>} 
                            bordered={false}
                        >
                            <Table 
                                dataSource={monthlyStats} 
                                columns={monthColumns} 
                                rowKey="month" 
                                pagination={false} 
                                size="small"
                                scroll={{ y: 300 }}
                            />
                        </Card>
                    </div>
                </div>
            );
        };

        // --- 主应用入口 ---
        const App = () => {
            const [addresses, setAddresses] = useState([]);
            const [routes, setRoutes] = useState([]);
            const [activeTab, setActiveTab] = useState('0');
            const [printData, setPrintData] = useState(null); // 打印内容（App 级，避免切 Tab 时被卸载）
            const [editingRoute, setEditingRoute] = useState(null);
            const [editingOrder, setEditingOrder] = useState(null);
            const [highlightedOrderId, setHighlightedOrderId] = useState(null);

            useEffect(() => {
                setAddresses(getAddresses());
                setRoutes(getRoutes());
                // 移除 loading
                const loading = document.getElementById('loading-text');
                if (loading) loading.style.display = 'none';

                // 预定单提醒检查
                const allOrders = getOrders();
                const today = dayjs().startOf('day').valueOf();
                const alerts = allOrders.filter(o => o.isPreOrder && o.reminderDate && dayjs(o.reminderDate).startOf('day').valueOf() <= today);
                
                if (alerts.length > 0) {
                    Modal.warning({
                        title: '⚠️ 预定单派车提醒',
                        content: (
                            <div style={{ marginTop: 16 }}>
                                <p style={{ color: '#d4380d', fontWeight: 'bold' }}>您有 {alerts.length} 个预定单已到达或超过派车提醒日期！</p>
                                <ul style={{ paddingLeft: 20, maxHeight: 150, overflowY: 'auto' }}>
                                    {alerts.map(a => (
                                        <li key={a.id} style={{ marginBottom: 4 }}>
                                            {a.shipmentId || a.poNumber || '未知单号'} 
                                            (提醒日: {dayjs(a.reminderDate).format('MM-DD')})
                                        </li>
                                    ))}
                                </ul>
                            </div>
                        ),
                        okText: '去处理',
                        onOk: () => {
                            setActiveTab('5');
                        }
                    });
                }
            }, []);

            const handleEditOrder = (order) => {
                setEditingOrder(order);
                setActiveTab('4');
                message.info('已载入订单信息，修改后点击“保存修改”即可更新记录');
            };

            const handleOrderComplete = () => {
                setEditingOrder(null);
                setActiveTab('5'); 
            };

            const handleCancelEdit = () => {
                setEditingOrder(null);
                message.info('已取消编辑');
            };

            const handleBackup = () => {
                const data = {
                    addresses: getAddresses(),
                    routes: getRoutes(),
                    orders: getOrders(),
                    version: '1.0',
                    backupDate: new Date().toISOString()
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `派车系统备份-${dayjs().format('YYYY-MM-DD')}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                message.success('备份文件已下载');
            };

            const handleImport = (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (data.addresses) saveAddresses(data.addresses);
                        if (data.routes) saveRoutes(data.routes);
                        if (data.orders) saveOrders(data.orders);
                        
                        message.success('数据导入成功，页面即将刷新');
                        setTimeout(() => window.location.reload(), 1500);
                    } catch (error) {
                        message.error('导入失败：文件格式错误');
                        console.error(error);
                    }
                };
                reader.readAsText(file);
                event.target.value = '';
            };

            const items = [
                {
                    key: '0',
                    label: <span className="app-nav-label"><icons.DashboardOutlined className="app-nav-ico" />总览</span>,
                    children: <Overview 
                        onNavigate={setActiveTab} 
                        onEditOrder={handleEditOrder}
                        onHighlightOrder={(id) => {
                            setHighlightedOrderId(id);
                            setTimeout(() => setHighlightedOrderId(null), 3000);
                        }}
                    />,
                },
                {
                    key: '4',
                    label: <span className="app-nav-label"><icons.FileAddOutlined className="app-nav-ico" />派车单生成</span>,
                    children: <DispatchGenerator 
                        routes={routes} 
                        addresses={addresses} 
                        setAddresses={setAddresses}
                        setPrintData={setPrintData}
                        editingOrder={editingOrder}
                        onOrderComplete={handleOrderComplete}
                        onCancelEdit={handleCancelEdit}
                    />,
                },
                {
                    key: '5',
                    label: <span className="app-nav-label"><icons.UnorderedListOutlined className="app-nav-ico" />订单记录</span>,
                    children: <OrderManagement 
                        addresses={addresses}
                        onEditOrder={handleEditOrder}
                        highlightedOrderId={highlightedOrderId}
                        setPrintData={setPrintData}
                    />,
                },
                {
                    key: '2',
                    label: <span className="app-nav-label"><icons.BranchesOutlined className="app-nav-ico" />DIY 路线规划</span>,
                    children: <RoutePlanning 
                        addresses={addresses} 
                        routes={routes} 
                        setRoutes={setRoutes} 
                        setActiveTab={setActiveTab} 
                        editingRoute={editingRoute}
                        setEditingRoute={setEditingRoute}
                    />,
                },
                {
                    key: '3',
                    label: <span className="app-nav-label"><icons.GlobalOutlined className="app-nav-ico" />线路管理</span>,
                    children: <RouteManagement 
                        routes={routes} 
                        addresses={addresses} 
                        setRoutes={setRoutes} 
                        setActiveTab={setActiveTab}
                        setEditingRoute={setEditingRoute}
                    />,
                },
                {
                    key: '6',
                    label: <span className="app-nav-label"><icons.BarChartOutlined className="app-nav-ico" />数据分析</span>,
                    children: <DataAnalysis />,
                },
                {
                    key: '1',
                    label: <span className="app-nav-label"><icons.EnvironmentOutlined className="app-nav-ico" />地址库管理</span>,
                    children: <AddressLibrary addresses={addresses} setAddresses={setAddresses} />,
                },
            ];

            return (
                <ConfigProvider
                    theme={{
                        token: {
                            colorPrimary: '#4f46e5',
                            borderRadius: 10,
                            colorBgContainer: '#ffffff',
                        },
                    }}
                >
                    {/* 打印内容统一挂在 App 层：切 Tab / 组件卸载都不会把打印内容带走 */}
                    {printData && ReactDOM.createPortal(
                        <DispatchSheetPrint data={printData} addresses={addresses} />,
                        document.getElementById('print-root')
                    )}
                    <div className="app-shell">
                        <aside className="app-side">
                            <div className="app-brand">
                                <span className="app-brand-mark">{React.createElement(icons.CarOutlined)}</span>
                                <div>
                                    <div className="app-brand-title">派车表</div>
                                    <div className="app-brand-sub">DISPATCH</div>
                                </div>
                            </div>
                            <nav className="app-nav">
                                {items.map(it => (
                                    <div
                                        key={it.key}
                                        className={'app-nav-item' + (activeTab === it.key ? ' active' : '')}
                                        onClick={() => setActiveTab(it.key)}
                                    >
                                        {it.label}
                                    </div>
                                ))}
                            </nav>
                            <div className="app-side-foot">
                                <Button block className="side-btn" onClick={handleBackup} icon={React.createElement(icons.CloudDownloadOutlined)}>备份数据</Button>
                                <Button block className="side-btn" onClick={() => document.getElementById('import-input').click()} icon={React.createElement(icons.CloudUploadOutlined)}>恢复数据</Button>
                                <input 
                                    type="file" 
                                    id="import-input" 
                                    style={{display: 'none'}} 
                                    accept=".json" 
                                    onChange={handleImport} 
                                />
                            </div>
                        </aside>
                        <main className="app-main">
                            {(items.find(i => i.key === activeTab) || {}).children}
                        </main>
                    </div>
                </ConfigProvider>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
