                    'Delivery Date',
                    'Equipment',
                    '车行',
                    '件数',
                    '体积 (CBM)',
                    '重量 (KG)',
                    'Remarks'
                ];

                tableHTML += '<thead><tr>';
                columns.forEach(col => {
                    tableHTML += `<th>${col}<\/th>`;
                });
                tableHTML += '<\/tr><\/thead>';

                // 数据行
                tableHTML += '<tbody>';
                
                // 辅助函数：获取地址名称
                const getAddrName = (id) => {
                    const addr = addresses.find(a => a.id === id);
                    return addr ? (addr.name || '未知站点') : '';
                };

                selectedOrders.forEach(o => {
                    // 解析站点信息
                    const stops = o.stops || [];
                    let shipper = '';
                    let logistics = '';
                    let delivery = '';

                    // 检查是否包含类型定义 (新逻辑)
                    // 即使有类型定义，也尝试使用智能识别来增强（针对可能未正确标记的数据）
                    // 但优先使用明确的类型
                    
                    const categorizeStop = (stop) => {
                         // 1. 优先使用明确的类型
                         if (stop.type) return stop.type;
                         
                         // 2. 智能识别 (针对旧数据或未选类型的数据)
                         const addrName = getAddrName(stop.addressId);
                         // 这里我们无法获取详细地址(location)因为 getAddrName 只返回名字
                         // 为了更准确，我们需要直接访问 addresses 数组
                         const addr = addresses.find(a => a.id === stop.addressId);
                         if (addr) {
                             const keywords = ['物流园', '物流中心', '保税仓', '仓库', '仓储', '堆场', 'Park', 'Logistics', 'Warehouse', 'Bonded', 'Depot'];
                             const text = ((addr.name || '') + (addr.location || '')).toLowerCase();
                             if (keywords.some(k => text.includes(k.toLowerCase()))) {
                                 return 'logistics';
                             }
                         }
                         
                         return null; // 无法确定
                    };

                    const pickups = [];
                    const logisticsStops = [];
                    const deliveries = [];

                    if (stops.length > 0) {
                        stops.forEach((s, index) => {
                            let type = categorizeStop(s);
                            
                            // 3. 如果仍未确定类型，使用位置推断 (兼容旧逻辑)
                            if (!type) {
                                if (index === 0) type = 'pickup';
                                else if (index === stops.length - 1) type = 'delivery';
                                else {
                                    // 修正逻辑：对于中间站点，如果不是明确识别为物流园，
                                    // 且不包含物流园关键词，则默认视为额外的提货点
                                    // 除非它非常靠近末尾，可能被视为额外的送货点（这里暂且简化为提货点，满足用户"两个提货地"的需求）
                                    type = 'pickup';
                                }
                            }
                            
                            const name = getAddrName(s.addressId);
                            if (type === 'pickup') pickups.push(name);
                            else if (type === 'delivery') deliveries.push(name);
                            else logisticsStops.push(name);
                        });
                        
                        shipper = pickups.join(' + ');
                        delivery = deliveries.join(' + ');
                        logistics = logisticsStops.join(' + ');
                    }

                    tableHTML += '<tr>';
                    // 1. Porgram -> routeName
                    tableHTML += `<td>${o.routeName || ''}<\/td>`;
                    // 2. shipment -> shipmentId
                    tableHTML += `<td>${o.shipmentId || ''}<\/td>`;
                    // 3. OIA PO# -> poNumber
                    tableHTML += `<td>${o.poNumber || ''}<\/td>`;
                    // 4. Shipper Location
                    tableHTML += `<td>${shipper}<\/td>`;
                    // 5. Logistics Park
                    tableHTML += `<td>${logistics}<\/td>`;
                    // 6. Delivery Location
                    tableHTML += `<td>${delivery}<\/td>`;
                    // 7. Pickup Date
                    tableHTML += `<td>${o.pickupDate ? dayjs(o.pickupDate).format('YYYY-MM-DD') : ''}<\/td>`;
                    // 8. Delivery Date
                    tableHTML += `<td>${o.deliveryDate ? dayjs(o.deliveryDate).format('YYYY-MM-DD') : ''}<\/td>`;
                    // 9. Equipment -> vehicleType
                    tableHTML += `<td>${o.vehicleType || ''}<\/td>`;
                    // 10. 车行 -> fleet
                    tableHTML += `<td>${o.fleet || ''}<\/td>`;
                    // 11. 件数 -> cargoCount
                    tableHTML += `<td>${o.cargoCount || ''}<\/td>`;
                    // 12. 体积 -> cargoCbm
                    tableHTML += `<td>${o.cargoCbm || ''}<\/td>`;
                    // 13. 重量 -> cargoWeight
                    tableHTML += `<td>${o.cargoWeight || ''}<\/td>`;
                    // 14. Remarks -> note
                    tableHTML += `<td>${o.note || ''}<\/td>`;
                    
                    tableHTML += '<\/tr>';
                });
                tableHTML += '<\/tbody><\/table><\/body><\/html>';

                // 创建并下载文件
                try {
                    const blob = new Blob([tableHTML], { type: 'application/vnd.ms-excel' });
                    const url = window.URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = `订单导出_自定义格式_${dayjs().format('YYYYMMDD_HHmmss')}.xls`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    window.URL.revokeObjectURL(url);
                    message.success(`成功导出 ${selectedOrders.length} 条记录 (自定义格式)`);
                } catch (error) {
                    console.error('Export error:', error);
                    message.error('导出失败');
                }
            };

            const handleBatchDelete = () => {
                if (selectedRowKeys.length === 0) {
                    message.warning('请先勾选要删除的订单');
                    return;
                }

                Modal.confirm({
                    title: '确认批量删除',
                    content: `确定要删除选中的 ${selectedRowKeys.length} 条订单记录吗？此操作不可恢复。`,
                    okText: '确认删除',
                    okType: 'danger',
                    cancelText: '取消',
                    onOk() {
                        const newOrders = orders.filter(o => !selectedRowKeys.includes(o.id));
                        saveOrders(newOrders);
                        setOrders(newOrders);
                        setSelectedRowKeys([]);
                        message.success(`成功删除 ${selectedRowKeys.length} 条记录`);
                    },
                });
            };

            const filteredOrders = orders.filter(o => 
                !searchText || 
                (o.shipmentId && o.shipmentId.toLowerCase().includes(searchText.toLowerCase())) ||
                (o.poNumber && o.poNumber.toLowerCase().includes(searchText.toLowerCase())) ||
                (o.routeName && o.routeName.toLowerCase().includes(searchText.toLowerCase())) ||
                (o.fleet && o.fleet.toLowerCase().includes(searchText.toLowerCase()))
            );

            const rowSelection = {
                selectedRowKeys,
                onChange: (newSelectedRowKeys) => {
                    setSelectedRowKeys(newSelectedRowKeys);
                },
            };

            const columns = [
                { title: 'Shipment ID', dataIndex: 'shipmentId', key: 'shipmentId' },
                { title: 'PO 号码', dataIndex: 'poNumber', key: 'poNumber' },
                { title: '路线名称', dataIndex: 'routeName', key: 'routeName' },
                { title: '承运车队', dataIndex: 'fleet', key: 'fleet' },
                { 
                    title: '提货日期', 
                    dataIndex: 'pickupDate', 
                    key: 'pickupDate',
                    render: t => t ? dayjs(t).format('YYYY-MM-DD') : '-',
                    sorter: (a, b) => {
                        const dateA = a.pickupDate ? dayjs(a.pickupDate).valueOf() : 0;
                        const dateB = b.pickupDate ? dayjs(b.pickupDate).valueOf() : 0;
                        return dateA - dateB;
                    }
                },
                {
                    title: '操作',
                    key: 'action',
                    width: 250,
                    render: (_, record) => (
                        <Space size="small">
                            <Button type="link" size="small" onClick={() => handleReprint(record)}>
                                🖨️ 打印
                            </Button>
                            <Button type="link" size="small" onClick={() => onEditOrder(record)}>
                                ✏️ 编辑
                            </Button>
                            <Popconfirm title="确定删除？" onConfirm={() => handleDelete(record.id)}>
                                <Button type="link" size="small" danger>删除</Button>
                            </Popconfirm>
                        </Space>
                    ),
                },
            ];

            return (
                <div>
                    {printData && ReactDOM.createPortal(
                        <DispatchSheetPrint data={printData} addresses={addresses} />,
                        document.getElementById('print-root')
                    )}
                    <Card bordered={false} style={{ marginBottom: 24, boxShadow: '0 1px 2px 0 rgba(0, 0, 0, 0.05)' }}>
                        <div className="section-title" style={{ fontSize: '1.125rem', marginBottom: 24, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
                                <div>
                                    <span style={{ fontSize: '1.25rem', marginRight: 8 }}>📋</span>
                                    历史订单记录 <span style={{fontSize: '0.875rem', color: '#6b7280', fontWeight: 'normal'}}>({filteredOrders.length})</span>
                                </div>
                                <Input 
                                    placeholder="搜索 Shipment ID / PO / 路线 / 车队..." 
                                    prefix={<span style={{ color: '#9ca3af' }}>🔍</span>} 
                                    value={searchText}
                                    onChange={e => setSearchText(e.target.value)}
                                    style={{ width: 350 }}
                                    allowClear
                                />
                            </div>
                            <Space>
                                <Button onClick={handleExport} icon={<span>📊</span>}>
                                    导出Excel
                                </Button>
                                <Button danger onClick={handleBatchDelete} icon={<span>🗑️</span>}>
                                    批量删除
                                </Button>
                                <Button onClick={refreshOrders}>🔄 刷新列表</Button>
                            </Space>
                        </div>
                        <div style={{ marginBottom: 16 }}>
                            <span style={{ marginLeft: 8 }}>
                                {selectedRowKeys.length > 0 ? `已选择 ${selectedRowKeys.length} 项` : ''}
                            </span>
                        </div>
                        <Table 
                            rowSelection={rowSelection}
                            columns={columns} 
                            dataSource={filteredOrders} 
                            rowKey="id" 
                            pagination={{ pageSize: 10 }} 
                            scroll={{ x: 800 }}
                        />
                    </Card>
                </div>
            );
        };

        // 6. 总览/仪表盘组件 (新增)
        const Overview = ({ onNavigate }) => {
            const [orders, setOrders] = useState([]);
            const [pendingDispatch, setPendingDispatch] = useState([]);
            const [inTransit, setInTransit] = useState([]);

            useEffect(() => {
                const allOrders = getOrders();
                setOrders(allOrders);
                processOrders(allOrders);
            }, []);

            const processOrders = (data) => {
                const today = dayjs().startOf('day');
                
                const pending = [];
                const transit = [];

                data.forEach(order => {
                    const pickupDate = order.pickupDate ? dayjs(order.pickupDate).startOf('day') : null;
                    const deliveryDate = order.deliveryDate ? dayjs(order.deliveryDate).endOf('day') : null;

                    if (!pickupDate) return;

                    // 1. 待派车判断 (智能提前提醒)
                    // 逻辑：提货日期的前1个工作日需要准备
                    let alertDate = pickupDate.subtract(1, 'day');
                    
                    // 如果提货日期是周一(1)，前一天是周日，应该提前到周五(subtract 3 days from Mon)
                    // 如果提货日期是周日(0)，前一天是周六，应该提前到周五(subtract 2 days from Sun)
                    // 如果提货日期是周六(6)，前一天是周五，应该提前到周五(subtract 1 day from Sat)
                    
                    // 修正逻辑：我们想找到“哪天开始提醒”。
                    // 如果提货是周二，周一提醒。
                    // 如果提货是周一，上周五提醒。
                    // 如果提货是周日，上周五提醒。
                    // 如果提货是周六，上周五提醒。
                    
                    if (pickupDate.day() === 1) { // Mon
                        alertDate = pickupDate.subtract(3, 'day'); // Fri
                    } else if (pickupDate.day() === 0) { // Sun
                        alertDate = pickupDate.subtract(2, 'day'); // Fri
                    } else if (pickupDate.day() === 6) { // Sat
                        alertDate = pickupDate.subtract(1, 'day'); // Fri
                    }
                    
                    // 只要 今天 >= 提醒日 且 今天 < 提货日，就算“准备派车”
                    // 另外，如果今天已经是提货日了，但还没发货（假设还没过），也可以算？
                    // 这里的逻辑是：Dashboard显示“需要关注的单子”。
                    // 范围：AlertDate <= Today < PickupDate
                    
                    if (today.isSame(alertDate, 'day') || (today.isAfter(alertDate) && today.isBefore(pickupDate))) {
                        pending.push({
                            ...order,
                            statusReason: today.isSame(alertDate, 'day') ? '今日需安排' : '逾期/临近'
                        });
                    }

                    // 2. 运输中判断
                    // 逻辑：提货日期 <= 今天 <= 送货日期
                    // 如果没有送货日期，假设提货当天即运输中
                    if (today.isSame(pickupDate, 'day') || (deliveryDate && today.isAfter(pickupDate) && today.isBefore(deliveryDate.add(1, 'day')))) {
                         transit.push(order);
                    }
                });

                // 按日期排序
                pending.sort((a, b) => dayjs(a.pickupDate).valueOf() - dayjs(b.pickupDate).valueOf());
                transit.sort((a, b) => dayjs(a.pickupDate).valueOf() - dayjs(b.pickupDate).valueOf());

                setPendingDispatch(pending);
                setInTransit(transit);
            };

            const cardStyle = {
                marginBottom: 24, 
                boxShadow: '0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)',
                borderRadius: 8
            };

            const columns = [
                { title: 'Shipment ID', dataIndex: 'shipmentId', key: 'shipmentId' },
                { title: '路线', dataIndex: 'routeName', key: 'routeName' },
                { 
                    title: '提货日期', 
                    dataIndex: 'pickupDate', 
                    key: 'pickupDate',
                    render: t => <span style={{color: '#d97706', fontWeight: 'bold'}}>{dayjs(t).format('YYYY-MM-DD')}</span>
                },
                { title: '承运车队', dataIndex: 'fleet', key: 'fleet' },
                {
                    title: '操作',
                    key: 'action',
                    render: (_, record) => (
                        <Button type="link" size="small" onClick={() => onNavigate('5')}>查看详情</Button>
                    )
                }
            ];

            return (
                <div style={{ padding: '0 8px' }}>
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 24 }}>
                        {/* 待派车/准备派车 */}
                        <Card 
                            title={
                                <div style={{display: 'flex', alignItems: 'center', gap: 8}}>
                                    <span style={{fontSize: 20}}>📢</span>
                                    <span style={{fontSize: 18, fontWeight: 'bold', color: '#b45309'}}>准备派车 ({pendingDispatch.length})</span>
                                </div>
                            } 
                            bordered={false} 
                            style={{...cardStyle, borderTop: '4px solid #f59e0b'}}
                            headStyle={{backgroundColor: '#fffbeb'}}
                        >
                            {pendingDispatch.length > 0 ? (
                                <Table 
                                    dataSource={pendingDispatch} 
                                    columns={columns} 
                                    rowKey="id" 
                                    pagination={false} 
                                    size="small"
                                />
                            ) : (
                                <Empty description="暂无急需派车的订单" image={Empty.PRESENTED_IMAGE_SIMPLE} />
                            )}
                            <div style={{marginTop: 16, fontSize: 12, color: '#9ca3af'}}>
                                * 智能提醒：根据提货日期提前1个工作日提醒（自动跳过周末）
                            </div>
                        </Card>

                        {/* 运输中 */}
                        <Card 
                            title={
                                <div style={{display: 'flex', alignItems: 'center', gap: 8}}>
                                    <span style={{fontSize: 20}}>🚚</span>
                                    <span style={{fontSize: 18, fontWeight: 'bold', color: '#15803d'}}>运输中 ({inTransit.length})</span>
                                </div>
                            } 
                            bordered={false} 
                            style={{...cardStyle, borderTop: '4px solid #22c55e'}}
                            headStyle={{backgroundColor: '#f0fdf4'}}
                        >
                             {inTransit.length > 0 ? (
                                <Table 
                                    dataSource={inTransit} 
                                    columns={columns} 
                                    rowKey="id" 
                                    pagination={false} 
                                    size="small"
                                />
                            ) : (
                                <Empty description="暂无运输中的订单" image={Empty.PRESENTED_IMAGE_SIMPLE} />
                            )}
                             <div style={{marginTop: 16, fontSize: 12, color: '#9ca3af'}}>
                                * 状态说明：当前日期在提货日期和送货日期之间
                            </div>
                        </Card>
                    </div>
                </div>
            );
        };

        // --- 主应用入口 ---
        const App = () => {
            const [addresses, setAddresses] = useState([]);
            const [routes, setRoutes] = useState([]);
            const [activeTab, setActiveTab] = useState('0');
            const [editingRoute, setEditingRoute] = useState(null);
            const [editingOrder, setEditingOrder] = useState(null);

            useEffect(() => {
                setAddresses(getAddresses());
                setRoutes(getRoutes());
                // 移除 loading
                const loading = document.getElementById('loading-text');
                if (loading) loading.style.display = 'none';
            }, []);

            const handleEditOrder = (order) => {
                setEditingOrder(order);
                setActiveTab('4');
                message.info('已载入订单信息，修改后点击“保存修改”即可更新记录');
            };

            const handleOrderComplete = () => {
                setEditingOrder(null);
                setActiveTab('5'); 
            };

            const handleCancelEdit = () => {
                setEditingOrder(null);
                message.info('已取消编辑');
            };

            const handleBackup = () => {
                const data = {
                    addresses: getAddresses(),
                    routes: getRoutes(),
                    orders: getOrders(),
                    version: '1.0',
                    backupDate: new Date().toISOString()
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `派车系统备份-${dayjs().format('YYYY-MM-DD')}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                message.success('备份文件已下载');
            };

            const handleImport = (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (data.addresses) saveAddresses(data.addresses);
                        if (data.routes) saveRoutes(data.routes);
                        if (data.orders) saveOrders(data.orders);
                        
                        message.success('数据导入成功，页面即将刷新');
                        setTimeout(() => window.location.reload(), 1500);
                    } catch (error) {
                        message.error('导入失败：文件格式错误');
                        console.error(error);
                    }
                };
                reader.readAsText(file);
                event.target.value = '';
            };

            const items = [
                {
                    key: '0',
                    label: <span style={{fontSize: 16}}>📊 总览</span>,
                    children: <Overview onNavigate={setActiveTab} />,
                },
                {
                    key: '4',
                    label: <span style={{fontSize: 16}}>📄 派车单生成</span>,
                    children: <DispatchGenerator 
                        routes={routes} 
                        addresses={addresses} 
                        editingOrder={editingOrder}
                        onOrderComplete={handleOrderComplete}
                        onCancelEdit={handleCancelEdit}
                    />,
                },
                {
                    key: '5',
                    label: <span style={{fontSize: 16}}>🗓️ 订单记录</span>,
                    children: <OrderManagement 
                        addresses={addresses}
                        onEditOrder={handleEditOrder}
                    />,
                },
                {
                    key: '2',
                    label: <span style={{fontSize: 16}}>🚚 DIY 路线规划</span>,
                    children: <RoutePlanning 
                        addresses={addresses} 
                        routes={routes} 
                        setRoutes={setRoutes} 
                        setActiveTab={setActiveTab} 
                        editingRoute={editingRoute}
                        setEditingRoute={setEditingRoute}
                    />,
                },
                {
                    key: '3',
                    label: <span style={{fontSize: 16}}>📋 线路管理</span>,
                    children: <RouteManagement 
                        routes={routes} 
                        addresses={addresses} 
                        setRoutes={setRoutes} 
                        setActiveTab={setActiveTab}
                        setEditingRoute={setEditingRoute}
                    />,
                },
                {
                    key: '1',
                    label: <span style={{fontSize: 16}}>🏢 地址库管理</span>,
                    children: <AddressLibrary addresses={addresses} setAddresses={setAddresses} />,
                },
            ];

            return (
                <ConfigProvider
                    theme={{
                        token: {
                            colorPrimary: '#1677ff',
                            borderRadius: 8,
                            colorBgContainer: '#ffffff',
                        },
                    }}
                >
                    <div className="container">
                        <div style={{ position: 'relative', marginBottom: 40, textAlign: 'center' }}>
                            <Title level={2} style={{ margin: 0, color: '#1f2937', display: 'inline-block' }}>
                                <span style={{fontWeight: 800, fontSize: '34px'}}>
                                    🚛 派车表管理系统
                                </span>
                            </Title>
                            <div style={{ position: 'absolute', right: 0, top: '50%', transform: 'translateY(-50%)' }}>
                                <Space>
                                    <Button onClick={handleBackup}>📤 备份数据</Button>
                                    <Button onClick={() => document.getElementById('import-input').click()}>📥 恢复数据</Button>
                                </Space>
                            </div>
                            <input 
                                type="file" 
                                id="import-input" 
                                style={{display: 'none'}} 
                                accept=".json" 
                                onChange={handleImport} 
                            />
                        </div>
                        <Tabs 
                            defaultActiveKey="0" 
                            activeKey={activeTab} 
                            onChange={setActiveTab} 
                            items={items} 
                            type="card"
                            size="large"
                            tabBarStyle={{marginBottom: 32}}
                        />
                    </div>
                </ConfigProvider>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
