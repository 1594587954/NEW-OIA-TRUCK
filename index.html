                { title: '联系人', dataIndex: 'contactPerson', key: 'contactPerson' },
                { title: '联系方式', dataIndex: 'contactInfo', key: 'contactInfo' },
                { title: '备注', dataIndex: 'note', key: 'note', render: t => t ? <Text type="secondary" ellipsis={{tooltip:t}} style={{maxWidth: 150}}>{t}</Text> : '-' },
                { title: '内部注意事项', dataIndex: 'precautions', key: 'precautions', render: t => t ? <Text type="danger" ellipsis={{tooltip:t}} style={{maxWidth: 150}}>⚠️ {t}</Text> : '-' },
                {
                    title: '操作',
                    key: 'action',
                    width: 150,
                    render: (_, record) => (
                        <Space size="small">
                            <Button type="link" size="small" onClick={() => handleEdit(record)}>编辑</Button>
                            <Popconfirm title="确定删除?" onConfirm={() => handleDelete(record.id)}>
                                <Button type="link" danger size="small">删除</Button>
                            </Popconfirm>
                        </Space>
                    ),
                },
            ];

            const filteredAddresses = addresses.filter(addr => 
                !searchText || 
                addr.name.includes(searchText) || 
                (addr.location && addr.location.includes(searchText)) ||
                (addr.contactPerson && addr.contactPerson.includes(searchText)) ||
                (addr.shortName && addr.shortName.includes(searchText))
            );

            const handleEdit = (record) => {
                setEditingId(record.id);
                form.setFieldsValue(record);
                setIsModalOpen(true);
            };

            const handleDelete = (id) => {
                const newAddresses = addresses.filter(item => item.id !== id);
                setAddresses(newAddresses);
                saveAddresses(newAddresses);
                message.success('删除成功');
            };

            const handleOk = () => {
                form.validateFields().then(values => {
                    let newAddresses;
                    if (editingId) {
                        newAddresses = addresses.map(item => item.id === editingId ? { ...item, ...values } : item);
                    } else {
                        newAddresses = [...addresses, { id: Date.now().toString(), ...values }];
                    }
                    setAddresses(newAddresses);
                    saveAddresses(newAddresses);
                    setIsModalOpen(false);
                    form.resetFields();
                    setEditingId(null);
                    message.success(editingId ? '更新成功' : '添加成功');
                });
            };

            const rowSelection = {
                selectedRowKeys,
                onChange: (newSelectedRowKeys) => {
                    setSelectedRowKeys(newSelectedRowKeys);
                }
            };

            const handleBatchEditSubmit = () => {
                batchForm.validateFields().then(values => {
                    const hasChanges = Object.values(values).some(val => val !== undefined && val !== '' && val !== null);
                    if (!hasChanges) {
                        message.warning('请填写需要修改的字段');
                        return;
                    }
                    
                    const newAddresses = addresses.map(addr => {
                        if (selectedRowKeys.includes(addr.id)) {
                            const updatedAddr = { ...addr };
                            if (values.contactPerson !== undefined && values.contactPerson !== '') updatedAddr.contactPerson = values.contactPerson;
                            if (values.contactInfo !== undefined && values.contactInfo !== '') updatedAddr.contactInfo = values.contactInfo;
                            if (values.note !== undefined && values.note !== '') updatedAddr.note = values.note;
                            if (values.precautions !== undefined && values.precautions !== '') updatedAddr.precautions = values.precautions;
                            return updatedAddr;
                        }
                        return addr;
                    });
                    
                    setAddresses(newAddresses);
                    saveAddresses(newAddresses);
                    message.success(`已成功批量修改 ${selectedRowKeys.length} 个地址`);
                    setIsBatchModalVisible(false);
                    setSelectedRowKeys([]);
                    batchForm.resetFields();
                });
            };

            return (
                <div>
                    <div className="page-head">
                        <div className="page-head-l">
                            <div className="page-title"><span className="pi">{React.createElement(icons.EnvironmentOutlined)}</span>地址库管理</div>
                            <div className="page-sub">维护工厂、物流园等地址，内部注意事项会在派车时自动提醒</div>
                        </div>
                    </div>
                    <Card bordered={false}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20 }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
                                <div style={{ fontSize: '1.05rem', fontWeight: 700, whiteSpace: 'nowrap' }}>
                                    地址列表 <span style={{fontSize: '0.875rem', color: 'var(--muted)', fontWeight: 500}}>({filteredAddresses.length})</span>
                                </div>
                                <Input 
                                    placeholder="搜索名称、地址或联系人..." 
                                    prefix={React.createElement(icons.SearchOutlined, { style: { color: 'var(--muted)' } })} 
                                    value={searchText}
                                    onChange={e => setSearchText(e.target.value)}
                                    style={{ width: 350 }}
                                    size="large"
                                    variant="filled"
                                    allowClear
                                />
                            </div>
                            <Space>
                                {selectedRowKeys.length > 0 && (
                                    <Button 
                                        type="primary" 
                                        onClick={() => setIsBatchModalVisible(true)}
                                        size="large"
                                    >
                                        批量修改 ({selectedRowKeys.length})
                                    </Button>
                                )}
                                <Button 
                                    type="primary" 
                                    icon={React.createElement(icons.PlusOutlined)} 
                                    onClick={() => { setEditingId(null); form.resetFields(); setIsModalOpen(true); }}
                                    size="large"
                                >
                                    新增地址
                                </Button>
                            </Space>
                        </div>
                        <Table 
                            rowSelection={rowSelection}
                            columns={columns} 
                            dataSource={filteredAddresses} 
                            rowKey="id"
                            pagination={{ pageSize: 8 }}
                            locale={{ emptyText: <Empty description="暂无地址数据" image={Empty.PRESENTED_IMAGE_SIMPLE} /> }}
                            scroll={{ x: 920 }}
                        />
                    </Card>

                    <Modal
                        title={
                            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                                <span style={{ fontSize: '1.25rem', color: 'var(--pri)' }}>{React.createElement(icons.EditOutlined)}</span>
                                <span>批量修改地址</span>
                            </div>
                        }
                        open={isBatchModalVisible}
                        onOk={handleBatchEditSubmit}
                        onCancel={() => {
                            setIsBatchModalVisible(false);
                            batchForm.resetFields();
                        }}
                        okText="确认修改"
                        cancelText="取消"
                        width={600}
                        destroyOnClose
                    >
                        <div style={{ marginBottom: 24, color: '#4b5563', backgroundColor: '#f3f4f6', padding: 12, borderRadius: 8 }}>
                            已选择 <b>{selectedRowKeys.length}</b> 个地址。请填写需要批量更新的字段 <b>(留空表示不修改原数据)</b>：
                        </div>
                        <Form form={batchForm} layout="vertical">
                            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px' }}>
                                <Form.Item name="contactPerson" label="联系人">
                                    <Input placeholder="留空不修改" size="large" variant="filled" />
                                </Form.Item>
                                <Form.Item name="contactInfo" label="联系方式">
                                    <Input placeholder="留空不修改" size="large" variant="filled" />
                                </Form.Item>
                            </div>
                            <Form.Item name="note" label="默认备注">
                                <Input.TextArea rows={3} placeholder="留空不修改，输入内容将覆盖原备注" size="large" variant="filled" />
                            </Form.Item>
                            <Form.Item name="precautions" label="内部注意事项">
                                <Input.TextArea rows={3} placeholder="留空不修改，输入内容将覆盖原注意事项" size="large" variant="filled" />
                            </Form.Item>
                        </Form>
                    </Modal>

                    <Modal
                        title={editingId ? "编辑地址" : "新增地址"}
                        open={isModalOpen}
                        onOk={handleOk}
                        onCancel={() => setIsModalOpen(false)}
                        okText="保存"
                        cancelText="取消"
                        width={600}
                        centered
                    >
                        <Form form={form} layout="vertical" style={{ paddingTop: 16 }}>
                            <Form.Item name="name" label="工厂/物流园名称" rules={[{ required: true, message: '请输入名称' }]}>
                                <Input size="large" variant="filled" placeholder="例如：捷通物流园" />
                            </Form.Item>
                            <Form.Item name="shortName" label="简称" extra="用于自动生成线路名称：选完站点后线路名会按「简称-简称-简称」自动生成，不填则用全名">
                                <Input size="large" variant="filled" placeholder="例如：赛隆" />
                            </Form.Item>
                            <Form.Item name="location" label="详细地址" rules={[{ required: true, message: '请输入地址' }]}>
                                <Input size="large" variant="filled" placeholder="例如：深圳市龙岗区xx路xx号" />
                            </Form.Item>
                            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
                                <Form.Item name="contactPerson" label="联系人">
                                    <Input size="large" variant="filled" placeholder="姓名" />
                                </Form.Item>
                                <Form.Item name="contactInfo" label="联系方式">
                                    <Input size="large" variant="filled" placeholder="电话/手机" />
                                </Form.Item>
                            </div>
                            <Form.Item name="note" label="默认备注 (会自动合并到路线规划中)">
                                <Input.TextArea rows={3} variant="filled" placeholder="例如：进门需要登记，车辆限高4米等" />
                            </Form.Item>
                            <Form.Item name="precautions" label="内部注意事项 (仅内部可见，自动提醒)">
                                <Input.TextArea rows={3} variant="filled" placeholder="例如：只能下午3点后送货、不要走某某高速..." />
                            </Form.Item>
                        </Form>
                    </Modal>
                </div>
            );
        };

        // 2. 路线规划组件
        const RoutePlanning = ({ addresses, routes, setRoutes, setActiveTab, editingRoute, setEditingRoute }) => {
            const [form] = Form.useForm();
            const [stops, setStops] = useState([]);
            const [draggedIndex, setDraggedIndex] = useState(null);
            const [fleets, setFleets] = useState([]);
            // 路线模板名称是否自动生成（用户手动改过后置 false）
            const routeNameAutoRef = React.useRef(true);
            
            useEffect(() => {
                setFleets(getFleets());
            }, []);

            // 全局货物信息状态
            const [cargoInfo, setCargoInfo] = useState({
                description: '',
                count: 0,
                cbm: 0,
                weight: 0,
                note: ''
            });

            // 如果处于编辑模式，初始化表单和状态
                useEffect(() => {
                    if (editingRoute) {
                        form.setFieldsValue({ 
                            routeName: editingRoute.name,
                            fleet: editingRoute.fleet,
                            vehicleType: editingRoute.vehicleType,
                            transitDays: editingRoute.transitDays
                        });
                    setStops(editingRoute.stops.map((s, i) => ({ 
                        key: Date.now() + i, 
                        addressId: s.addressId,
                        // 兼容旧数据：如果有type用type，没有则根据位置推断
                        type: s.type || (i === 0 ? 'pickup' : (i === editingRoute.stops.length - 1 ? 'delivery' : 'logistics'))
                    })));
                    setCargoInfo(editingRoute.cargo || { description: '', count: 0, cbm: 0, weight: 0, note: '' });
                    routeNameAutoRef.current = !editingRoute.name;
                }
            }, [editingRoute, form]);

            // 路线模板名称自动生成：按站点简称拼接「简称-简称-简称」
            const buildStopsName = (stopsList) => (stopsList || [])
                .map(s => {
                    const a = addresses.find(x => x.id === s.addressId);
                    if (!a) return '';
                    return (a.shortName || a.name || '').trim();
                })
                .filter(Boolean)
                .join('-');

            useEffect(() => {
                if (!routeNameAutoRef.current) return;
                form.setFieldsValue({ routeName: buildStopsName(stops) });
            }, [stops, addresses]);

            const handleCancelEdit = () => {
                setEditingRoute(null);
                form.resetFields();
                setStops([]);
                routeNameAutoRef.current = true;
                setCargoInfo({ description: '', count: 0, cbm: 0, weight: 0, note: '' });
                message.info('已取消编辑，重置为新建模式');
            };

            const handleAddStop = () => {
                // 智能默认类型：如果列表为空，默认提货；如果已有站点，新加的默认送货（假设是在最后）
                // 用户可以手动修改
                let defaultType = 'logistics';
                if (stops.length === 0) defaultType = 'pickup';
                else defaultType = 'delivery';

                setStops([...stops, { key: Date.now(), addressId: null, type: defaultType }]);
            };

            const handleRemoveStop = (index) => {
                const newStops = [...stops];
                newStops.splice(index, 1);
                setStops(newStops);
            };

            const handleDragStart = (e, index) => {
                setDraggedIndex(index);
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', index);
            };

            const handleDragOver = (e, index) => {
                e.preventDefault();
                if (draggedIndex === null || draggedIndex === index) return;
                
                const newStops = [...stops];
                const draggedItem = newStops[draggedIndex];
                newStops.splice(draggedIndex, 1);
                newStops.splice(index, 0, draggedItem);
                
                setStops(newStops);
                setDraggedIndex(index);
            };

            const handleDragEnd = () => {
                setDraggedIndex(null);
            };

            const handleStopTypeChange = (index, val) => {
                const newStops = [...stops];
                newStops[index].type = val;
                setStops(newStops);
            };

            const handleStopChange = (index, value) => {
                const newStops = [...stops];
                newStops[index].addressId = value;
                
                // 自动填充逻辑：获取选中地址的备注，并追加到货物备注中
                const addr = addresses.find(a => a.id === value);
                if (addr) {
                    // 智能识别物流园/仓库
                    const keywords = ['物流园', '物流中心', '保税仓', '仓库', '仓储', '堆场', 'Park', 'Logistics', 'Warehouse', 'Bonded', 'Depot'];
                    const text = ((addr.name || '') + (addr.location || '')).toLowerCase();
                    if (keywords.some(k => text.includes(k.toLowerCase()))) {
                        newStops[index].type = 'logistics';
                        message.success(`已自动识别为物流园: ${addr.name}`);
                    }

                    if (addr.note) {
                        // 检查当前备注是否已包含该地址备注，避免重复添加
                        const currentNote = cargoInfo.note || '';
                        if (!currentNote.includes(addr.note)) {
                            const newNote = currentNote ? `${currentNote}\n${addr.note}` : addr.note;
                            setCargoInfo(prev => ({ ...prev, note: newNote }));
                            message.info(`已自动添加地址备注: ${addr.note}`);
                        }
                    }
                }
                setStops(newStops);
            };

            const handleSaveRoute = () => {
                form.validateFields().then(values => {
                    if (stops.length === 0) {
                        message.error('请至少添加一个站点');
                        return;
                    }
                    for (let stop of stops) {
                        if (!stop.addressId) {
                            message.error('请为所有站点选择地址');
                            return;
                        }
                    }

                    const routeData = {
                        id: editingRoute ? editingRoute.id : Date.now().toString(),
                        name: values.routeName,
                        fleet: values.fleet,
                        vehicleType: values.vehicleType,
                        transitDays: values.transitDays,
                        // 新的数据结构：站点包含地址ID和类型
                        stops: stops.map(s => ({
                            addressId: s.addressId,
                            type: s.type || 'logistics'
                        })),
                        // 全局货物信息
                        cargo: { ...cargoInfo },
                        createdAt: editingRoute ? editingRoute.createdAt : new Date().toISOString()
                    };

                    let newRoutes;
                    if (editingRoute) {
                        newRoutes = routes.map(r => r.id === editingRoute.id ? routeData : r);
                        message.success('路线更新成功');
                    } else {
                        newRoutes = [routeData, ...routes];
                        message.success('路线创建成功');
                    }

                    setRoutes(newRoutes);
                    saveRoutes(newRoutes);
                    
                    // 重置表单
                    form.resetFields();
                    setStops([]);
                    setCargoInfo({ description: '', count: 0, cbm: 0, weight: 0, note: '' });
                    setEditingRoute(null);
                    routeNameAutoRef.current = true;
                    setActiveTab('3'); // 跳转到管理页
                });
            };

            return (
                <div>
                    <div className="page-head">
                        <div className="page-head-l">
                            <div className="page-title"><span className="pi">{React.createElement(icons.BranchesOutlined)}</span>{editingRoute ? '编辑路线' : 'DIY 路线规划'}</div>
                            <div className="page-sub">编排站点顺序与默认货物信息，沉淀可复用路线模板</div>
                        </div>
                    </div>
                    <Card bordered={false} style={{ marginBottom: 24 }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 24 }}>
                            <div className="sec-h" style={{ marginBottom: 0 }}>
                                <span className="si">{React.createElement(icons.ProfileOutlined)}</span>
                                {editingRoute ? '编辑路线信息' : '新建路线规划'}
                            </div>
                            {editingRoute && (
                                <Button onClick={handleCancelEdit} type="default" danger shape="round">
                                    取消编辑
                                </Button>
                            )}
                        </div>
                        <Form form={form} layout="vertical" onValuesChange={(changed) => { if (Object.prototype.hasOwnProperty.call(changed, 'routeName')) routeNameAutoRef.current = false; }}>
                            <Form.Item name="routeName" label={<span style={{ fontWeight: 'bold', color: '#374151' }}>路线模板名称</span>} rules={[{ required: true, message: '请输入路线名称' }]}>
                                <Input size="large" placeholder="例如：2023-10-27 深圳-东莞-惠州 拼车" variant="filled" style={{fontSize: 16}} />
                            </Form.Item>
                            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '16px' }}>
                                <Form.Item name="fleet" label="默认承运车队 (选填)">
                                    <AutoComplete
                                        options={fleets.map(f => ({ value: f.value }))}
                                        filterOption={(inputValue, option) =>
                                            option.value.toUpperCase().indexOf(inputValue.toUpperCase()) !== -1
                                        }
                                        size="large"
                                        variant="filled"
                                        placeholder="输入或选择车队"
                                    />
                                </Form.Item>
                                <Form.Item name="vehicleType" label="默认车型偏好 (选填)">
                                    <Input size="large" variant="filled" placeholder="例如：2台5吨车 / 40HQ" />
                                </Form.Item>
                                <Form.Item name="transitDays" label="默认时效 (天数, 选填)">
                                    <InputNumber size="large" variant="filled" style={{width: '100%'}} min={0} placeholder="例如：1、2" />
                                </Form.Item>
                            </div>
                        </Form>
                    </Card>

                    <Card bordered={false} style={{ marginBottom: 24, boxShadow: '0 1px 2px 0 rgba(0, 0, 0, 0.05)' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
                            <div className="sec-h" style={{ marginBottom: 0 }}>
                                <span className="si">{React.createElement(icons.EnvironmentOutlined)}</span>
                                站点选择 ({stops.length})
                            </div>
                            <Button type="primary" ghost onClick={handleAddStop} icon={<span>+</span>} shape="round">添加站点</Button>
                        </div>
                        
                        {stops.length === 0 && (
                            <div style={{ padding: 32, backgroundColor: '#f9fafb', borderRadius: 8, border: '1px dashed #d1d5db', display: 'flex', justifyContent: 'center' }}>
                                <Empty description="暂无站点，请点击上方按钮添加" image={Empty.PRESENTED_IMAGE_SIMPLE} />
                            </div>
                        )}

                        <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
                            {stops.map((stop, index) => (
                                <div 
                                    key={stop.key} 
                                    draggable
                                    onDragStart={(e) => handleDragStart(e, index)}
                                    onDragOver={(e) => handleDragOver(e, index)}
                                    onDragEnd={handleDragEnd}
                                    style={{ 
                                        display: 'flex', alignItems: 'center', gap: 12, padding: 12, 
                                        backgroundColor: draggedIndex === index ? '#f3f4f6' : 'white', 
                                        borderWidth: 1, borderColor: '#f3f4f6', borderStyle: 'solid', 
                                        borderRadius: 8, boxShadow: '0 1px 2px 0 rgba(0, 0, 0, 0.05)',
                                        opacity: draggedIndex === index ? 0.5 : 1,
                                        cursor: 'grab',
                                        transition: 'all 0.2s ease'
                                    }}
                                >
                                    <div style={{ backgroundColor: 'var(--pri)', color: 'white', borderRadius: 12, width: 32, height: 32, display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 700, boxShadow: '0 6px 12px -6px rgba(79,70,229,.85)', flexShrink: 0 }}>
                                        {index + 1}
                                    </div>
                                    <Select
                                        value={stop.type}
                                        onChange={(val) => handleStopTypeChange(index, val)}
                                        style={{ width: 110, flexShrink: 0 }}
                                        size="large"
                                        variant="filled"
                                        options={[
                                            { label: '提货', value: 'pickup' },
                                            { label: '送货', value: 'delivery' },
                                            { label: '物流园', value: 'logistics' }
                                        ]}
                                    />
                                    <Select 
                                        showSearch
                                        placeholder="搜索地址库（支持名称/地址模糊搜索）..."
                                        filterOption={(input, option) => 
                                            (option?.label ?? '').toLowerCase().includes(input.toLowerCase())
                                        }
                                        value={stop.addressId}
                                        onChange={(val) => handleStopChange(index, val)}
                                        style={{ flex: 1, fontWeight: 500 }}
                                        size="large"
                                        variant="borderless"
                                        status={!stop.addressId ? 'warning' : ''}
                                    >
                                        {addresses.map(addr => (
                                            <Select.Option 
                                                key={addr.id} 
                                                value={addr.id}
                                                label={`${addr.name} ${addr.location}`}
                                            >
                                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', width: '100%' }}>
                                                    <span style={{ fontWeight: 'bold', color: '#1f2937' }}>{addr.name}</span>
                                                    <span style={{ color: '#9ca3af', fontSize: 14, marginLeft: 8 }}>{addr.location}</span>
                                                </div>
                                            </Select.Option>
                                        ))}
                                    </Select>
                                    <Button 
                                        type="text" 
                                        danger 
                                        onClick={() => handleRemoveStop(index)}
                                        style={{ borderRadius: 9999 }}
                                        icon={<span style={{ fontSize: '1.125rem' }}>×</span>}
                                        title="删除"
                                    />
                                </div>
                            ))}
                        </div>
                    </Card>

                    <Card bordered={false} style={{ marginBottom: 32 }}>
                        <div className="sec-h">
                            <span className="si">{React.createElement(icons.InboxOutlined)}</span>
                            货物信息
                        </div>
                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(12, 1fr)', gap: 24 }}>
                            <div style={{ gridColumn: 'span 12' }}>
                                <Text style={{ display: 'block', fontWeight: 500, color: '#4b5563', marginBottom: 8 }}>货物名称/描述</Text>
                                <Input 
                                    size="large"
                                    placeholder="例如：电子配件 一批" 
                                    value={cargoInfo.description}
                                    variant="filled"
                                    onChange={e => setCargoInfo({...cargoInfo, description: e.target.value})}
                                />
                            </div>
                            <div style={{ gridColumn: 'span 4' }}>
                                <Text style={{ display: 'block', fontWeight: 500, color: '#4b5563', marginBottom: 8 }}>总件数</Text>
                                <InputNumber 
                                    min={0} 
                                    controls={false}
                                    size="large"
                                    style={{ width: '100%' }} 
                                    variant="filled"
                                    value={cargoInfo.count}
                                    onChange={val => setCargoInfo({...cargoInfo, count: val})}
                                />
                            </div>
                            <div style={{ gridColumn: 'span 4' }}>
                                <Text style={{ display: 'block', fontWeight: 500, color: '#4b5563', marginBottom: 8 }}>总重量 (KG)</Text>
                                <InputNumber 
                                    min={0} 
                                    controls={false}
                                    size="large"
                                    style={{ width: '100%' }} 
                                    variant="filled"
                                    value={cargoInfo.weight}
                                    onChange={val => setCargoInfo({...cargoInfo, weight: val})}
                                />
                            </div>
                            <div style={{ gridColumn: 'span 4' }}>
                                <Text style={{ display: 'block', fontWeight: 500, color: '#4b5563', marginBottom: 8 }}>总CBM (立方)</Text>
                                <InputNumber 
                                    min={0} 
                                    controls={false}
                                    size="large"
                                    style={{ width: '100%' }} 
                                    variant="filled"
                                    value={cargoInfo.cbm}
                                    onChange={val => setCargoInfo({...cargoInfo, cbm: val})}
                                />
                            </div>
                            <div style={{ gridColumn: 'span 12' }}>
                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
                                    <Text style={{ fontWeight: 500, color: '#4b5563' }}>货物/操作备注</Text>
                                    <Tag color="orange">自动合并地址库备注</Tag>
                                </div>
                                <Input.TextArea 
                                    rows={4} 
                                    placeholder="选择地址后，地址库的备注会自动追加到这里"
                                    value={cargoInfo.note}
                                    variant="filled"
                                    onChange={e => setCargoInfo({...cargoInfo, note: e.target.value})}
                                    style={{ backgroundColor: '#fffbe6', borderColor: '#ffe58f' }}
                                />
                            </div>
                        </div>
                    </Card>

                    <div style={{ display: 'flex', gap: 16 }}>
                        <Button 
                            type="primary" 
                            size="large" 
                            block 
                            onClick={handleSaveRoute} 
                            style={{ height: 48, fontSize: 16, fontWeight: 700, borderRadius: 12 }} 
                            disabled={stops.length === 0}
                        >
                            {editingRoute ? '更新路线信息' : '保存并生成路线'}
                        </Button>
                    </div>
                </div>
            );
        };

        // 3. 线路管理组件
        const RouteManagement = ({ routes, addresses, setRoutes, setActiveTab, setEditingRoute }) => {
            const [searchText, setSearchText] = useState('');
            const [selectedRowKeys, setSelectedRowKeys] = useState([]);
            const [isBatchModalVisible, setIsBatchModalVisible] = useState(false);
            const [batchForm] = Form.useForm();

            // 获取最新地址信息的帮助函数
            const getAddressDetails = (addressId) => addresses.find(a => a.id === addressId) || {};

            const handleDeleteRoute = (id) => {
                const newRoutes = routes.filter(r => r.id !== id);
                setRoutes(newRoutes);
                saveRoutes(newRoutes);
                message.success('路线已删除');
            };

            const handleEditRoute = (record) => {
                setEditingRoute(record);
                setActiveTab('2');
                message.info('进入编辑模式');
            };

            const filteredRoutes = routes.filter(r => 
                !searchText || 
                r.name.toLowerCase().includes(searchText.toLowerCase()) ||
                (r.cargo && r.cargo.description && r.cargo.description.includes(searchText))
            );

            const columns = [
                {
                    title: '路线名称',
                    dataIndex: 'name',
                    key: 'name',
                    render: (text, record) => (
                        <div>
                            <div style={{fontWeight: 'bold', fontSize: 15}}>
                                {text} 
                                {typeof record.transitDays === 'number' && (
                                    <Tag color="blue" style={{marginLeft: 8, fontSize: 12}}>时效: +{record.transitDays}天</Tag>
                                )}
                            </div>
                            <div style={{fontSize: 12, color: '#888'}}>{new Date(record.createdAt).toLocaleDateString()}</div>
                        </div>
                    )
                },
                {
                    title: '货物信息概览',
                    key: 'cargo',
                    render: (_, record) => {
                        if (!record.cargo) return '-';
                        return (
                            <div style={{fontSize: 13}}>
                                <div><Text strong>{record.cargo.description || '无描述'}</Text></div>
                                <Space size="small" style={{color: '#666'}}>
                                    <span>{record.cargo.count}件</span>
                                    <span>|</span>
                                    <span>{record.cargo.weight}kg</span>
                                    <span>|</span>
                                    <span>{record.cargo.cbm}m³</span>
                                </Space>
                            </div>
                        );
                    }
                },
                {
                    title: '操作',
                    key: 'action',
                    width: 150,
                    render: (_, record) => (
                        <Space size="small">
                            <Button type="link" size="small" onClick={() => handleEditRoute(record)}>编辑</Button>
                            <Popconfirm title="确定删除此路线?" onConfirm={() => handleDeleteRoute(record.id)}>
                                <Button type="link" danger size="small">删除</Button>
                            </Popconfirm>
                        </Space>
                    )
                }
            ];

            const expandedRowRender = (record) => {
                return (
                    <div style={{ backgroundColor: '#f9fafb', padding: 16, borderRadius: 4 }}>
                        {record.cargo && record.cargo.note && (
                            <div style={{ marginBottom: 16 }}>
                                <Text strong style={{ display: 'block', marginBottom: 4, color: 'var(--pri)' }}>货物 / 操作备注</Text>
                                <div style={{ padding: 8, backgroundColor: '#fefce8', borderWidth: 1, borderColor: '#fef9c3', borderStyle: 'solid', borderRadius: 4, color: '#374151', whiteSpace: 'pre-wrap' }}>
                                    {record.cargo.note}
                                </div>
                            </div>
                        )}
                        
                        <Table 
                            dataSource={record.stops} 
                            pagination={false}
                            rowKey={(r, i) => i}
                            size="small"
                            bordered
                            columns={[
                                { title: '序号', key: 'index', width: 60, align: 'center', render: (_, __, index) => index + 1 },
                                { 
                                    title: '途径站点详细信息', 
                                    key: 'address',
                                    render: (_, stop) => {
                                        const addr = getAddressDetails(stop.addressId);
                                        const typeMap = { pickup: '提货', delivery: '送货', logistics: '物流园' };
                                        const typeColor = { pickup: 'blue', delivery: 'green', logistics: 'orange' };
                                        
                                        return (
                                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                                                    {stop.type && (
                                                        <Tag color={typeColor[stop.type]}>{typeMap[stop.type]}</Tag>
                                                    )}
                                                    <span>{addr.name || '已删除地址'} <Text type="secondary" style={{fontSize: 12}}>({addr.location})</Text></span>
                                                </div>
                                                <span>
                                                    <Tag>{addr.contactPerson}</Tag>
                                                    {addr.contactInfo}
                                                </span>
                                            </div>
                                        );
                                    }
                                }
                            ]}
                        />
                    </div>
                );
            };

            const rowSelection = {
                selectedRowKeys,
                onChange: (newSelectedRowKeys) => {
                    setSelectedRowKeys(newSelectedRowKeys);
                }
            };

            const handleBatchEditSubmit = () => {
                batchForm.validateFields().then(values => {
                    // Check if everything is empty
                    const hasChanges = Object.values(values).some(val => val !== undefined && val !== '' && val !== null);
                    if (!hasChanges) {
                        message.warning('请填写需要修改的字段');
                        return;
                    }
                    
                    const newRoutes = routes.map(route => {
                        if (selectedRowKeys.includes(route.id)) {
                            const updatedRoute = { ...route };
                            if (values.transitDays !== undefined && values.transitDays !== null) updatedRoute.transitDays = values.transitDays;
                            if (values.fleet !== undefined && values.fleet !== '') updatedRoute.fleet = values.fleet;
                            if (values.vehicleType !== undefined && values.vehicleType !== '') updatedRoute.vehicleType = values.vehicleType;
                            
                            if ((values.cargoDescription !== undefined && values.cargoDescription !== '') || 
                                (values.cargoNote !== undefined && values.cargoNote !== '')) {
                                updatedRoute.cargo = { ...(updatedRoute.cargo || {}) };
                                if (values.cargoDescription !== undefined && values.cargoDescription !== '') updatedRoute.cargo.description = values.cargoDescription;
                                if (values.cargoNote !== undefined && values.cargoNote !== '') updatedRoute.cargo.note = values.cargoNote;
                            }
                            return updatedRoute;
                        }
                        return route;
                    });
                    
                    setRoutes(newRoutes);
                    saveRoutes(newRoutes);
                    message.success(`已成功批量修改 ${selectedRowKeys.length} 条路线`);
                    setIsBatchModalVisible(false);
                    setSelectedRowKeys([]);
                    batchForm.resetFields();
                });
            };

            return (
                <div>
                    <div className="page-head">
                        <div className="page-head-l">
                            <div className="page-title"><span className="pi">{React.createElement(icons.GlobalOutlined)}</span>线路管理</div>
                            <div className="page-sub">维护路线模板、时效与货物概览，展开行可看站点明细</div>
                        </div>
                    </div>
                    <Card bordered={false} style={{ marginBottom: 24 }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20 }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
                                <div style={{ fontSize: '1.05rem', fontWeight: 700, whiteSpace: 'nowrap' }}>
                                    线路列表 <span style={{fontSize: '0.875rem', color: 'var(--muted)', fontWeight: 500}}>({filteredRoutes.length})</span>
                                </div>
                                <Input 
                                    placeholder="搜索路线名称或货物信息..." 
                                    prefix={React.createElement(icons.SearchOutlined, { style: { color: 'var(--muted)' } })} 
                                    value={searchText}
                                    onChange={e => setSearchText(e.target.value)}
                                    style={{ width: 350 }}
                                    size="large"
                                    variant="filled"
                                    allowClear
                                />
                            </div>
                            <div>
                                {selectedRowKeys.length > 0 && (
                                    <Button 
                                        type="primary" 
                                        onClick={() => setIsBatchModalVisible(true)}
                                        size="large"
                                    >
                                        批量修改 ({selectedRowKeys.length})
                                    </Button>
                                )}
                            </div>
                        </div>

                        <Table 
                            rowSelection={rowSelection}
                            columns={columns} 
                            dataSource={filteredRoutes} 
                            rowKey="id"
                            expandable={{ expandedRowRender, expandRowByClick: true, showExpandColumn: false }}
                            pagination={{ pageSize: 10 }}
                            locale={{ emptyText: <Empty description="暂无路线数据" image={Empty.PRESENTED_IMAGE_SIMPLE} /> }}
                        />
                    </Card>

                    <Modal
                        title={
                            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                                <span style={{ fontSize: '1.25rem', color: 'var(--pri)' }}>{React.createElement(icons.EditOutlined)}</span>
                                <span>批量修改路线</span>
                            </div>
                        }
                        open={isBatchModalVisible}
                        onOk={handleBatchEditSubmit}
                        onCancel={() => {
                            setIsBatchModalVisible(false);
                            batchForm.resetFields();
                        }}
                        okText="确认修改"
                        cancelText="取消"
                        width={600}
                        destroyOnClose
                    >
                        <div style={{ marginBottom: 24, color: '#4b5563', backgroundColor: '#f3f4f6', padding: 12, borderRadius: 8 }}>
                            已选择 <b>{selectedRowKeys.length}</b> 条路线。请填写需要批量更新的字段 <b>(留空表示不修改原数据)</b>：
                        </div>
                        <Form form={batchForm} layout="vertical">
                            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px' }}>
                                <Form.Item name="transitDays" label="默认时效 (天数)">
                                    <InputNumber style={{width: '100%'}} min={0} placeholder="留空不修改" size="large" variant="filled" />
                                </Form.Item>
                                <Form.Item name="fleet" label="默认承运车队">
                                    <Input placeholder="留空不修改" size="large" variant="filled" />
                                </Form.Item>
                                <Form.Item name="vehicleType" label="默认车型偏好">
                                    <Input placeholder="留空不修改" size="large" variant="filled" />
                                </Form.Item>
                                <Form.Item name="cargoDescription" label="货物名称/描述">
                                    <Input placeholder="留空不修改" size="large" variant="filled" />
                                </Form.Item>
                            </div>
                            <Form.Item name="cargoNote" label="货物/操作备注">
                                <Input.TextArea rows={4} placeholder="留空不修改，输入内容将覆盖原备注" size="large" variant="filled" />
                            </Form.Item>
                        </Form>
                    </Modal>
                </div>
            );
        };


        // 5. 订单记录管理组件 (新增)
        const OrderManagement = ({ addresses, onEditOrder, highlightedOrderId, setPrintData }) => {
            const [orders, setOrders] = React.useState([]);
            const [viewData, setViewData] = React.useState(null); // 新增用于查看的 state
            const [searchText, setSearchText] = React.useState('');
            const [selectedRowKeys, setSelectedRowKeys] = React.useState([]);
            const [dateRange, setDateRange] = React.useState(null);
            const [statusFilter, setStatusFilter] = React.useState('all'); // all | pre | draft

            React.useEffect(() => {
                setOrders(getOrders());
            }, []);

            const refreshOrders = () => {
                setOrders(getOrders());
                setSelectedRowKeys([]); // 刷新时清空选择
                message.success('列表已刷新');
            };

            const handleDelete = (id) => {
                const newOrders = orders.filter(o => o.id !== id);
                saveOrders(newOrders);
                setOrders(newOrders);
                setSelectedRowKeys(selectedRowKeys.filter(key => key !== id));
                message.success('记录已删除');
            };

            const handleReprint = (record) => {
                setPrintData(record);
                
                // 构造文件名: 派车单-单号(Shipment优先)-提货日期-车型-路线名称
                const identifier = record.shipmentId || record.poNumber || '无单号';
                const pickupDate = record.pickupDate ? dayjs(record.pickupDate).format('YYYY-MM-DD') : '无日期';
                const vehicleType = record.vehicleType || '无车型';
                const safeRouteName = record.routeName || '无路线';
                const fileName = `派车单-${identifier}-${pickupDate}-${vehicleType}-${safeRouteName}`;
                
                const oldTitle = document.title;
                document.title = fileName;

                waitPrintReady(record.shipmentId || record.poNumber || record.routeName || '', () => {
                    window.print();
                    setTimeout(() => {
                        document.title = oldTitle;
                        setPrintData(null);
                    }, 1000);
                });
            };

            const handleExport = () => {
                if (selectedRowKeys.length === 0) {
                    message.warning('请先勾选要导出的订单');
                    return;
                }

                const selectedOrders = orders.filter(o => selectedRowKeys.includes(o.id));
                
                // HTML 导出方式 (去除样式)
                let tableHTML = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="UTF-8"><\/head><body>';
                tableHTML += '<table border="1" style="border-collapse: collapse;">';
                
                // 表头定义
                const columns = [
                    'Porgram',
                    'shipment',
                    'OIA PO#',
                    'Shipper Location',
                    'Logistics Park',
                    'Delivery Location',
                    'Pickup Date',
                    'Delivery Date',
                    'Equipment',
                    '车行',
                    '件数',
                    '重量 (KG)',
                    '体积 (CBM)',
                    'Remarks'
                ];

                tableHTML += '<thead><tr>';
                columns.forEach(col => {
                    tableHTML += `<th>${col}<\/th>`;
                });
                tableHTML += '<\/tr><\/thead>';

                // 数据行
                tableHTML += '<tbody>';
                
                // 辅助函数：获取地址名称
                const getAddrName = (id) => {
                    const addr = addresses.find(a => a.id === id);
                    return addr ? (addr.name || '未知站点') : '';
                };

                selectedOrders.forEach(o => {
                    // 解析站点信息
                    const stops = o.stops || [];
                    let shipper = '';
                    let logistics = '';
                    let delivery = '';

                    // 检查是否包含类型定义 (新逻辑)
                    // 即使有类型定义，也尝试使用智能识别来增强（针对可能未正确标记的数据）
                    // 但优先使用明确的类型
                    
                    const categorizeStop = (stop) => {
                         // 1. 优先使用明确的类型
                         if (stop.type) return stop.type;
                         
                         // 2. 智能识别 (针对旧数据或未选类型的数据)
                         const addrName = getAddrName(stop.addressId);
                         // 这里我们无法获取详细地址(location)因为 getAddrName 只返回名字
                         // 为了更准确，我们需要直接访问 addresses 数组
                         const addr = addresses.find(a => a.id === stop.addressId);
                         if (addr) {
                             const keywords = ['物流园', '物流中心', '保税仓', '仓库', '仓储', '堆场', 'Park', 'Logistics', 'Warehouse', 'Bonded', 'Depot'];
                             const text = ((addr.name || '') + (addr.location || '')).toLowerCase();
                             if (keywords.some(k => text.includes(k.toLowerCase()))) {
                                 return 'logistics';
                             }
                         }
                         
                         return null; // 无法确定
                    };

                    const pickups = [];
                    const logisticsStops = [];
                    const deliveries = [];

                    if (stops.length > 0) {
                        stops.forEach((s, index) => {
                            let type = categorizeStop(s);
                            
                            // 3. 如果仍未确定类型，使用位置推断 (兼容旧逻辑)
                            if (!type) {
                                if (index === 0) type = 'pickup';
                                else if (index === stops.length - 1) type = 'delivery';
                                else {
                                    // 修正逻辑：对于中间站点，如果不是明确识别为物流园，
                                    // 且不包含物流园关键词，则默认视为额外的提货点
                                    // 除非它非常靠近末尾，可能被视为额外的送货点（这里暂且简化为提货点，满足用户"两个提货地"的需求）
                                    type = 'pickup';
                                }
                            }
                            
                            const name = getAddrName(s.addressId);
                            if (type === 'pickup') pickups.push(name);
                            else if (type === 'delivery') deliveries.push(name);
                            else logisticsStops.push(name);
                        });
                        
                        shipper = pickups.join(' + ');
                        delivery = deliveries.join(' + ');
                        logistics = logisticsStops.join(' + ');
                    }

                    tableHTML += '<tr>';
                    // 1. Porgram -> routeName
                    tableHTML += `<td>${o.routeName || ''}<\/td>`;
                    // 2. shipment -> shipmentId
                    tableHTML += `<td>${o.shipmentId || ''}<\/td>`;
                    // 3. OIA PO# -> poNumber
                    tableHTML += `<td>${o.poNumber || ''}<\/td>`;
                    // 4. Shipper Location
                    tableHTML += `<td>${shipper}<\/td>`;
                    // 5. Logistics Park
                    tableHTML += `<td>${logistics}<\/td>`;
                    // 6. Delivery Location
                    tableHTML += `<td>${delivery}<\/td>`;
                    // 7. Pickup Date
                    tableHTML += `<td>${o.pickupDate ? dayjs(o.pickupDate).format('YYYY-MM-DD') : ''}<\/td>`;
                    // 8. Delivery Date
                    tableHTML += `<td>${o.deliveryDate ? dayjs(o.deliveryDate).format('YYYY-MM-DD') : ''}<\/td>`;
                    // 9. Equipment -> vehicleType
                    tableHTML += `<td>${o.vehicleType || ''}<\/td>`;
                    // 10. 车行 -> fleet
                    tableHTML += `<td>${o.fleet || ''}<\/td>`;
                    // 11. 件数 -> cargoCount
                    tableHTML += `<td>${o.cargoCount || ''}<\/td>`;
                    // 12. 重量 -> cargoWeight
                    tableHTML += `<td>${o.cargoWeight || ''}<\/td>`;
                    // 13. 体积 -> cargoCbm
                    tableHTML += `<td>${o.cargoCbm || ''}<\/td>`;
                    // 14. Remarks -> note
                    tableHTML += `<td>${o.note || ''}<\/td>`;
                    
                    tableHTML += '<\/tr>';
                });
                tableHTML += '<\/tbody><\/table><\/body><\/html>';

                // 创建并下载文件
                try {
                    const blob = new Blob([tableHTML], { type: 'application/vnd.ms-excel' });
                    const url = window.URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = `订单导出_自定义格式_${dayjs().format('YYYYMMDD_HHmmss')}.xls`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    window.URL.revokeObjectURL(url);
                    message.success(`成功导出 ${selectedOrders.length} 条记录 (自定义格式)`);
                    
                    // 更新导出状态
                    const newOrders = orders.map(o => {
                        if (selectedRowKeys.includes(o.id)) {
                            return { ...o, isExported: true };
                        }
                        return o;
                    });
                    saveOrders(newOrders);
                    setOrders(newOrders);
                    setSelectedRowKeys([]); // 导出后清空选择
                } catch (error) {
                    console.error('Export error:', error);
                    message.error('导出失败');
                }
            };

            const handleBatchDelete = () => {
                if (selectedRowKeys.length === 0) {
                    message.warning('请先勾选要删除的订单');
                    return;
                }

                Modal.confirm({
                    title: '确认批量删除',
                    content: `确定要删除选中的 ${selectedRowKeys.length} 条订单记录吗？此操作不可恢复。`,
                    okText: '确认删除',
                    okType: 'danger',
                    cancelText: '取消',
                    onOk() {
                        const newOrders = orders.filter(o => !selectedRowKeys.includes(o.id));
                        saveOrders(newOrders);
                        setOrders(newOrders);
                        setSelectedRowKeys([]);
                        message.success(`成功删除 ${selectedRowKeys.length} 条记录`);
                    },
                });
            };

            const handleSelectByDateRange = (dates) => {
                setDateRange(dates);
                if (!dates || dates.length !== 2) return;
                
                const [start, end] = dates;
                const startDate = start.startOf('day');
                const endDate = end.endOf('day');

                const keysToSelect = orders.filter(o => {
                    if (!o.pickupDate) return false;
                    const pickup = dayjs(o.pickupDate);
                    return pickup.isAfter(startDate) && pickup.isBefore(endDate) || pickup.isSame(startDate, 'day') || pickup.isSame(endDate, 'day');
                }).map(o => o.id);

                if (keysToSelect.length > 0) {
                    // 合并已有选择和新选择
                    const newSelectedKeys = [...new Set([...selectedRowKeys, ...keysToSelect])];
                    setSelectedRowKeys(newSelectedKeys);
                    message.success(`已自动勾选符合日期范围的 ${keysToSelect.length} 条订单`);
                } else {
                    message.info('该日期范围内没有找到相关订单');
                }
            };

            // 一键选中全部未导出的订单（在当前筛选结果内）
            const handleSelectUnexported = () => {
                const keys = filteredOrders.filter(o => !o.isExported).map(o => o.id);
                if (keys.length === 0) {
                    message.info('当前列表里没有未导出的订单');
                    return;
                }
                setSelectedRowKeys(keys);
                message.success('已选中 ' + keys.length + ' 条未导出订单');
            };

            const toggleExportStatus = (record) => {
                const newOrders = orders.map(o => {
                    if (o.id === record.id) {
                        return { ...o, isExported: !o.isExported };
                    }
                    return o;
                });
                saveOrders(newOrders);
                setOrders(newOrders);
                message.success(record.isExported ? '已标记为未导出' : '已标记为已导出');
            };

            const filteredOrders = orders.filter(o => {
                if (statusFilter === 'pre' && !o.isPreOrder) return false;
                if (statusFilter === 'draft' && !o.isDraft) return false;
                
                return !searchText || 
                (o.shipmentId && o.shipmentId.toLowerCase().includes(searchText.toLowerCase())) ||
                (o.poNumber && o.poNumber.toLowerCase().includes(searchText.toLowerCase())) ||
                (o.routeName && o.routeName.toLowerCase().includes(searchText.toLowerCase())) ||
                (o.fleet && o.fleet.toLowerCase().includes(searchText.toLowerCase()))
            });

            const rowSelection = {
                selectedRowKeys,
                onChange: (newSelectedRowKeys) => {
                    setSelectedRowKeys(newSelectedRowKeys);
                },
            };

            const cellNowrap = { whiteSpace: 'nowrap' };
            const statusTags = (record) => (
                <React.Fragment>
                    {record.isDraft && <Tag color="default" style={{ margin: '4px 0 0' }}>草稿-待完善</Tag>}
                    {record.isPreOrder && !record.isDraft && <Tag color="warning" style={{ margin: '4px 0 0' }}>预定单-待派车</Tag>}
                </React.Fragment>
            );

            const columns = [
                {
                    title: 'Shipment ID', dataIndex: 'shipmentId', key: 'shipmentId', width: 150,
                    render: (t, record) => (
                        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-start' }}>
                            <span style={{ fontWeight: 600, color: '#1f2937', ...cellNowrap }}>{t || '-'}</span>
                            {statusTags(record)}
                        </div>
                    )
                },
                { title: 'PO 号码', dataIndex: 'poNumber', key: 'poNumber', width: 115, render: t => <span style={cellNowrap}>{t || '-'}</span> },
                {
                    title: '路线名称', dataIndex: 'routeName', key: 'routeName', width: 165,
                    render: t => <span style={{ color: '#374151' }}>{t || '-'}</span>
                },
                { title: '承运车队', dataIndex: 'fleet', key: 'fleet', width: 95, render: t => t || '-' },
                {
                    title: '提货日期',
                    dataIndex: 'pickupDate',
                    key: 'pickupDate',
                    width: 110,
                    render: t => t ? <span style={cellNowrap}>{dayjs(t).format('YYYY-MM-DD')}</span> : '-',
                    sorter: (a, b) => {
                        const dateA = a.pickupDate ? dayjs(a.pickupDate).valueOf() : 0;
                        const dateB = b.pickupDate ? dayjs(b.pickupDate).valueOf() : 0;
                        return dateA - dateB;
                    }
                },
                {
                    title: '操作',
                    key: 'action',
                    width: 176,
                    render: (_, record) => (
                        <Space size={2} wrap>
                            {record.isDraft && (
                                <Button type="primary" size="small" onClick={() => onEditOrder(record)}>
                                    继续完善
                                </Button>
                            )}
                            {record.isPreOrder && !record.isDraft && (
                                <Button type="primary" size="small" onClick={() => onEditOrder(record)}>
                                    完善并派车
                                </Button>
                            )}
                            <Button type="text" size="small" className="icon-btn" title="查看" onClick={() => setViewData(record)}>
                                {React.createElement(icons.EyeOutlined)}
                            </Button>
                            {!record.isPreOrder && !record.isDraft && (
                                <Button type="text" size="small" className="icon-btn" title="重新打印" onClick={() => handleReprint(record)}>
                                    {React.createElement(icons.PrinterOutlined)}
                                </Button>
                            )}
                            {!record.isPreOrder && !record.isDraft && (
                                <Button type="text" size="small" className="icon-btn" title="编辑" onClick={() => onEditOrder(record)}>
                                    {React.createElement(icons.EditOutlined)}
                                </Button>
                            )}
                            <Popconfirm title="确定删除？" onConfirm={() => handleDelete(record.id)}>
                                <Button type="text" size="small" className="icon-btn icon-btn-danger" title="删除">
                                    {React.createElement(icons.DeleteOutlined)}
                                </Button>
                            </Popconfirm>
                            <Tag
                                color={record.isExported ? 'success' : 'default'}
                                onClick={() => toggleExportStatus(record)}
                                style={{ margin: 0, cursor: 'pointer' }}
                            >
                                {record.isExported ? '已导出' : '未导出'}
                            </Tag>
                        </Space>
                    ),
                },
            ];

            return (
                <div>
                    <div className="page-head">
                        <div className="page-head-l">
                            <div className="page-title"><span className="pi">{React.createElement(icons.UnorderedListOutlined)}</span>订单记录</div>
                            <div className="page-sub">查看、筛选、导出与重新打印历史派车单</div>
                        </div>
                    </div>
                    
                    {/* 订单查看弹窗 */}
                    <Modal
                        title={
                            <div style={{display: 'flex', alignItems: 'center', gap: 8}}>
                                <span style={{fontSize: 18, color: 'var(--pri)'}}>{React.createElement(icons.SearchOutlined)}</span>
                                <span>订单预览</span>
                            </div>
                        }
                        open={!!viewData}
                        onCancel={() => setViewData(null)}
                        width={900}
                        footer={[
                            <Button key="close" onClick={() => setViewData(null)}>关闭</Button>,
                            <Button key="print" type="primary" onClick={() => {
                                const record = viewData;
                                setViewData(null);
                                handleReprint(record);
                            }}>
                                {React.createElement(icons.PrinterOutlined)} 打印
                            </Button>
                        ]}
                    >
                        {viewData && (
                            <div style={{ 
                                padding: '20px', 
                                background: '#f5f5f5', 
                                borderRadius: '8px',
                                maxHeight: '70vh',
                                overflowY: 'auto'
                            }}>
                                <div style={{ 
                                    background: '#fff', 
                                    padding: '20px', 
                                    boxShadow: '0 2px 8px rgba(0,0,0,0.1)',
                                    pointerEvents: 'none' /* 防止在预览中发生交互 */
                                }}>
                                    <DispatchSheetPrint data={viewData} addresses={addresses} />
                                </div>
                            </div>
                        )}
                    </Modal>

                    <div style={{
                        background: '#fff', borderRadius: 16, overflow: 'hidden',
                        border: '1px solid #edf0f5', boxShadow: '0 6px 18px rgba(15,23,42,0.05)'
                    }}>
                        {/* 标题 + 主操作 */}
                        <div style={{
                            display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                            gap: 16, flexWrap: 'wrap', padding: '16px 20px', borderBottom: '1px solid #f1f4f8'
                        }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                                <span style={{
                                    padding: '3px 12px', borderRadius: 999, background: 'var(--pri-50)',
                                    color: 'var(--pri)', fontSize: 13, fontWeight: 700
                                }}>{filteredOrders.length} 条记录</span>
                            </div>
                            <Space>
                                <Button className="toolbar-btn" onClick={handleSelectUnexported} icon={React.createElement(icons.CheckSquareOutlined)}>选中未导出</Button>
                                <Button className="toolbar-btn" onClick={handleExport} icon={React.createElement(icons.FileExcelOutlined)}>导出Excel</Button>
                                <Button className="toolbar-btn" danger onClick={handleBatchDelete} icon={React.createElement(icons.DeleteOutlined)} disabled={selectedRowKeys.length === 0}>批量删除</Button>
                                <Button className="toolbar-btn" onClick={refreshOrders} icon={React.createElement(icons.ReloadOutlined)}>刷新</Button>
                            </Space>
                        </div>

                        {/* 筛选行 */}
                        <div style={{
                            display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap',
                            padding: '14px 20px', background: '#fbfcfe', borderBottom: '1px solid #f1f4f8'
                        }}>
                            <Input
                                className="filter-bar"
                                placeholder="搜索 Shipment ID / PO / 路线 / 车队..."
                                prefix={React.createElement(icons.SearchOutlined, { style: { color: 'var(--muted)' } })}
                                value={searchText}
                                onChange={e => setSearchText(e.target.value)}
                                style={{ width: 330 }}
                                allowClear
                            />
                            <antd.Segmented
                                value={statusFilter}
                                onChange={setStatusFilter}
                                options={[
                                    { label: '全部', value: 'all' },
                                    { label: '预定单', value: 'pre' },
                                    { label: '草稿', value: 'draft' }
                                ]}
                            />
                            <DatePicker.RangePicker
                                value={dateRange}
                                onChange={handleSelectByDateRange}
                                placeholder={['提货开始日期', '提货结束日期']}
                                style={{ width: 285 }}
                            />
                            <span style={{
                                marginLeft: 'auto', fontSize: 12.5, fontWeight: 600,
                                color: selectedRowKeys.length > 0 ? '#2563eb' : '#9aa3af'
                            }}>
                                {selectedRowKeys.length > 0 ? '已选择 ' + selectedRowKeys.length + ' 项' : '未选择记录'}
                            </span>
                        </div>

                        <div style={{ padding: '4px 20px 20px' }}>
                            <Table
                                rowSelection={rowSelection}
                                columns={columns}
                                dataSource={filteredOrders}
                                rowKey="id"
                                pagination={{ pageSize: 10, showSizeChanger: false }}
                                scroll={{ x: 980 }}
                                rowClassName={(record) => record.id === highlightedOrderId ? 'highlighted-row' : ''}
                            />
                        </div>
                    </div>
                </div>
            );
        };

        // 6. 总览/仪表盘组件 (新增)
        const Overview = ({ onNavigate, onHighlightOrder, onEditOrder }) => {
            const [orders, setOrders] = useState([]);
            const [pendingDispatch, setPendingDispatch] = useState([]);
            const [inTransit, setInTransit] = useState([]);
            const [pendingPreOrders, setPendingPreOrders] = useState([]);
            const [draftOrders, setDraftOrders] = useState([]);

            useEffect(() => {
                const allOrders = getOrders();
                setOrders(allOrders);
                processOrders(allOrders);
            }, []);

            const processOrders = (data) => {
                const today = dayjs().startOf('day');
                
                const pending = [];
                const transit = [];
                const preOrders = [];

                data.forEach(order => {
                    if (order.isDraft) return; // 草稿不进入正式流程统计
                    if (order.isPreOrder) {
                        // 预定单处理逻辑
                        if (order.reminderDate) {
                            const reminder = dayjs(order.reminderDate).startOf('day');
                            if (reminder.valueOf() <= today.valueOf()) {
                                preOrders.push(order);
                            }
                        }
                        return; // 预定单不进入待派车和运输中
                    }

                    const pickupDate = order.pickupDate ? dayjs(order.pickupDate).startOf('day') : null;
                    const deliveryDate = order.deliveryDate ? dayjs(order.deliveryDate).startOf('day') : null;

                    if (!pickupDate) return;

                    // 1. 待派车判断 (智能提前提醒)
                    // 逻辑：提货日期的前1个工作日需要准备
                    let alertDate = pickupDate.subtract(1, 'day');
                    
                    // 如果提货日期是周一(1)，前一天是周日，应该提前到周五(subtract 3 days from Mon)
                    // 如果提货日期是周日(0)，前一天是周六，应该提前到周五(subtract 2 days from Sun)
                    // 如果提货日期是周六(6)，前一天是周五，应该提前到周五(subtract 1 day from Sat)
                    
                    // 修正逻辑：我们想找到“哪天开始提醒”。
                    // 如果提货是周二，周一提醒。
                    // 如果提货是周一，上周五提醒。
                    // 如果提货是周日，上周五提醒。
                    // 如果提货是周六，上周五提醒。
                    
                    if (pickupDate.day() === 1) { // Mon
                        alertDate = pickupDate.subtract(3, 'day'); // Fri
                    } else if (pickupDate.day() === 0) { // Sun
                        alertDate = pickupDate.subtract(2, 'day'); // Fri
                    } else if (pickupDate.day() === 6) { // Sat
                        alertDate = pickupDate.subtract(1, 'day'); // Fri
                    }
                    
                    // 只要 今天 >= 提醒日 且 今天 < 提货日，就算“准备派车”
                    // 另外，如果今天已经是提货日了，但还没发货（假设还没过），也可以算？
                    // 这里的逻辑是：Dashboard显示“需要关注的单子”。
                    // 范围：AlertDate <= Today < PickupDate
                    
                    if (today.isSame(alertDate, 'day') || (today.isAfter(alertDate) && today.isBefore(pickupDate))) {
                        pending.push({
                            ...order,
                            statusReason: today.isSame(alertDate, 'day') ? '今日需安排' : '逾期/临近'
                        });
                    }

                    // 2. 运输中判断
                    // 逻辑：提货日 <= 今天 <= 送货日；送货日次日起视为已完成，不再显示
                    // 如果没有送货日期，仅提货当天算运输中
                    if (deliveryDate) {
                        if (today.valueOf() >= pickupDate.valueOf() && today.valueOf() <= deliveryDate.valueOf()) {
                            transit.push(order);
                        }
                    } else if (today.isSame(pickupDate, 'day')) {
                        transit.push(order);
                    }
                });

                // 按日期排序
