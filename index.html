<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>派车表管理系统</title>
    
    <!-- 错误捕获脚本：如果页面白屏，会显示错误信息 -->
    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            document.getElementById('loading-text').style.display = 'none';
            document.getElementById('error-display').style.display = 'block';
            document.getElementById('error-message').innerText = 
                '加载出错: ' + message + '\n来源: ' + source + '\n行号: ' + lineno;
        };
    </script>

    <!-- 1. 加载 React 基础库 (本地化) -->
    <script src="./lib/react.production.min.js"></script>
    <script src="./lib/react-dom.production.min.js"></script>
    
    <!-- 2. 加载 Babel (本地化) -->
    <script src="./lib/babel.min.js"></script>
    
    <!-- 3. 加载 Dayjs (本地化) -->
    <script src="./lib/dayjs.min.js"></script>
    
    <!-- 4. 加载 Ant Design (本地化) -->
    <script src="./lib/antd.min.js"></script>
    <script src="./lib/ant-design-icons.min.js"></script>
    
    <!-- 5. 加载 SheetJS (Excel导出) -->
    <script src="https://cdn.staticfile.org/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root {
            --pri:#4f46e5; --pri-700:#4338ca; --pri-50:#eef2ff; --pri-100:#e0e7ff;
            --ink:#0f172a; --ink-2:#475569; --ink-3:#64748b; --muted:#94a3b8;
            --line:#e9ebf2; --line-2:#f1f3f8; --bg:#f5f6fb;
            --shadow:0 1px 2px rgba(16,24,40,.04), 0 12px 28px -18px rgba(16,24,40,.18);
            --r-card:18px; --r-ctl:10px;
        }
        html { overflow-x: hidden; }
        body {
            padding: 18px;
            background:
                radial-gradient(1100px 520px at 100% -8%, #eef2ff 0%, rgba(238,242,255,0) 55%),
                radial-gradient(900px 460px at -8% 2%, #f3eeff 0%, rgba(243,238,255,0) 50%),
                var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif;
            min-height: 100vh; color: var(--ink);
            -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }
        .container { max-width:1200px; margin:0 auto; background:#fff; padding:32px; border-radius:16px; min-height:500px; border:1px solid var(--line); }
        #error-display { display:none; color:red; padding:20px; background:#fff0f0; border:1px solid red; margin:20px; border-radius:8px; }
        .loading-container { text-align:center; padding:50px; }
        .loading-spinner { font-size:24px; color:var(--pri); margin-bottom:10px; }

        /* 打印专用样式 */
        @media print {
            @page { size: A4 portrait; margin: 10mm; }
            html, body { height:auto !important; overflow:visible !important; background:white !important; padding:0 !important; margin:0 !important; }
            body > *:not(#print-root) { display:none !important; }
            #print-root { display:block !important; position:relative; width:100%; background:white; }
            * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
        }
        #print-root { display: none; }

        /* 订单高亮效果 */
        .highlighted-row { animation: highlight-fade 3s ease-out forwards; }
        @keyframes highlight-fade { 0%{background-color:#eef2ff;} 50%{background-color:#eef2ff;} 100%{background-color:transparent;} }

        /* ===== 布局外壳 ===== */
        .app-shell { max-width:1360px; margin:0 auto; display:flex; gap:22px; align-items:flex-start; }
        .app-side {
            width:216px; flex:0 0 216px; padding:16px 14px;
            background:#fff; border:1px solid var(--line); border-radius:var(--r-card);
            position:sticky; top:18px; box-shadow:var(--shadow);
        }
        .app-brand { display:flex; align-items:center; gap:11px; padding:4px 6px 16px; border-bottom:1px solid var(--line-2); margin-bottom:12px; }
        .app-brand-mark {
            width:34px; height:34px; border-radius:10px; flex:0 0 34px;
            background:linear-gradient(135deg,#6366f1,#4f46e5); color:#fff; font-size:17px;
            display:inline-flex; align-items:center; justify-content:center;
            box-shadow:0 6px 14px -6px rgba(79,70,229,.65);
        }
        .app-brand-title { font-size:15px; font-weight:800; color:var(--ink); line-height:1.2; letter-spacing:-.2px; }
        .app-brand-sub { font-size:10px; color:var(--muted); letter-spacing:1.8px; font-weight:600; }
        .app-nav { display:flex; flex-direction:column; gap:3px; }
        .app-nav-item {
            position:relative; display:flex; align-items:center; padding:9px 11px; border-radius:10px;
            cursor:pointer; color:var(--ink-3); font-size:13.5px; font-weight:500;
            transition:background .15s ease, color .15s ease; user-select:none;
        }
        .app-nav-item:hover { background:#f5f6fb; color:var(--ink); }
        .app-nav-item.active { background:var(--pri-50); color:var(--pri); font-weight:600; }
        .app-nav-item.active::before { content:""; position:absolute; left:0; top:50%; transform:translateY(-50%); width:3px; height:16px; border-radius:0 3px 3px 0; background:var(--pri); }
        .app-nav-label { display:inline-flex; align-items:center; gap:10px; }
        .app-nav-ico { font-size:15px; }
        .app-side-foot { margin-top:14px; padding-top:12px; border-top:1px solid var(--line-2); display:flex; flex-direction:column; gap:8px; }
        .side-btn.ant-btn { border-radius:10px !important; font-size:13px !important; font-weight:600 !important; height:36px; border-color:var(--line) !important; color:var(--ink-3) !important; }
        .side-btn.ant-btn:hover { color:var(--pri) !important; border-color:var(--pri-100) !important; background:var(--pri-50) !important; }
        .app-main { flex:1; min-width:0; }

        /* ===== 页面头 ===== */
        .page-head { display:flex; align-items:flex-end; justify-content:space-between; gap:18px; flex-wrap:wrap; margin:2px 2px 20px; }
        .page-head-l { min-width:0; }
        .page-title { display:flex; align-items:center; gap:12px; font-size:27px; font-weight:800; color:var(--ink); letter-spacing:-.6px; line-height:1.1; }
        .page-title .pi { width:38px; height:38px; border-radius:11px; background:var(--pri-50); color:var(--pri); display:inline-flex; align-items:center; justify-content:center; font-size:20px; flex:none; }
        .page-sub { margin-top:7px; font-size:13px; color:var(--ink-3); }
        .page-actions { display:flex; align-items:center; gap:10px; }
        .sec-h { display:flex; align-items:center; gap:9px; font-size:14.5px; font-weight:700; color:var(--ink); margin-bottom:18px; }
        .sec-h .si { width:26px; height:26px; border-radius:8px; background:var(--pri-50); color:var(--pri); display:inline-flex; align-items:center; justify-content:center; font-size:14px; flex:none; }
        .section-title { color:var(--ink); font-weight:700; margin-bottom:16px; display:flex; align-items:center; gap:8px; }

        /* ===== antd 组件覆盖 ===== */
        .ant-btn { border-radius:var(--r-ctl) !important; font-weight:600; }
        .ant-btn-primary { box-shadow:0 8px 18px -9px rgba(79,70,229,.75) !important; }
        .ant-card { border-radius:var(--r-card) !important; box-shadow:var(--shadow) !important; border-color:var(--line) !important; }
        .ant-card-head { border-bottom:1px solid var(--line-2) !important; min-height:54px !important; }
        .ant-card-head-title { font-weight:700 !important; color:var(--ink) !important; }
        .ant-table { font-size:13.5px; }
        .ant-table-thead > tr > th { background:#fafbff !important; color:#7c869a !important; font-weight:600 !important; font-size:12px !important; border-bottom:1px solid var(--line) !important; }
        .ant-table-tbody > tr > td { border-bottom:1px solid var(--line-2) !important; }
        .ant-table-tbody > tr:hover > td { background:#fafbff !important; }
        .ant-input, .ant-input-number, .ant-picker, .ant-select-selector, .ant-input-affix-wrapper { border-radius:var(--r-ctl) !important; }
        .ant-modal-content { border-radius:18px !important; }
        .ant-modal-header { border-radius:18px 18px 0 0 !important; }
        .ant-tag { border-radius:999px !important; font-weight:600; border:none !important; }
        .ant-pagination-item { border-radius:10px !important; }
        .ant-pagination-item-active { border-color:var(--pri) !important; }
        .ant-segmented { border-radius:12px !important; background:#f1f3f8 !important; }
        .ant-segmented-item-selected { border-radius:9px !important; box-shadow:0 1px 3px rgba(16,24,40,.12) !important; }
        .ant-divider-inner-text { font-weight:700; color:var(--ink-2); }
        .ant-empty-description { color:var(--muted); }

        /* ===== 通用交互 ===== */
        .stat-chip { transition: box-shadow .18s ease, transform .18s ease, background .18s ease; }
        .stat-chip.clickable:hover { box-shadow:0 6px 16px rgba(15,23,42,.12); transform:translateY(-1px); background:#fff; }
        .order-row { transition: box-shadow .18s ease, transform .18s ease, border-color .18s ease, background .18s ease; }
        .order-row:hover { background:#fff; border-color:var(--line); box-shadow:0 6px 16px rgba(15,23,42,.07); transform:translateY(-1px); }
        .tbl-row { transition: background .16s ease; }
        .tbl-row:hover { background:#fafbff !important; }
        .filter-bar { border-radius:10px !important; }
        .filter-bar:focus-within { border-color:var(--pri-100) !important; box-shadow:0 0 0 3px rgba(79,70,229,.12); }
        .toolbar-btn { border-radius:10px !important; }
        .icon-btn.ant-btn { width:28px; height:28px; border-radius:8px; color:var(--muted); display:inline-flex; align-items:center; justify-content:center; font-size:14px; }
        .icon-btn.ant-btn:hover { background:var(--pri-50); color:var(--pri); }
        .icon-btn-danger.ant-btn:hover { background:#fff1f0; color:#ff4d4f; }
        .op-ico.ant-btn { display:inline-flex; align-items:center; gap:4px; padding:0 4px; height:auto; font-size:12.5px; }
        .op-ico.ant-btn .anticon { font-size:12px; }

        /* ===== 总览 ===== */
        .ov-empty { padding:46px 0 42px; text-align:center; }
        .ov-empty-ico { font-size:40px; color:#cbd5e1; line-height:1; margin-bottom:14px; }
        .ov-empty-t { font-size:15px; font-weight:700; color:var(--ink); margin-bottom:5px; }
        .ov-empty-s { font-size:12.5px; color:var(--muted); margin-bottom:16px; }
        .ov-head-date { font-size:12.5px; color:var(--muted); }
        .ov-panel { background:#fff; border:1px solid var(--line); border-radius:16px; overflow:hidden; box-shadow:var(--shadow); }

        /* KPI 卡片行 */
        .ov-kpis { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; margin:4px 2px 20px; }
        .ov-kpi { background:#fff; border:1px solid var(--line); border-radius:16px; padding:17px 18px 15px; box-shadow:var(--shadow); cursor:pointer; user-select:none; transition:box-shadow .18s ease, transform .18s ease, border-color .18s ease; }
        .ov-kpi:hover { box-shadow:0 14px 28px -16px rgba(15,23,42,.32); transform:translateY(-2px); border-color:var(--pri-100); }
        .ov-kpi-top { display:flex; align-items:center; justify-content:space-between; gap:12px; }
        .ov-kpi-ico { width:38px; height:38px; border-radius:11px; display:inline-flex; align-items:center; justify-content:center; font-size:19px; flex:none; }
        .ov-kpi-num { font-size:31px; font-weight:800; color:var(--ink); letter-spacing:-1px; line-height:1; font-variant-numeric:tabular-nums; }
        .ov-kpi-label { margin-top:13px; display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600; color:var(--ink-3); white-space:nowrap; }
        .ov-kpi.zero .ov-kpi-num { color:#cbd2dd; }
        .ov-kpi.zero .ov-kpi-label { color:#b7bdc7; }
        .ov-kpi.zero .ov-kpi-ico { color:#c3c9d4 !important; background:#f2f4f8 !important; }

        /* 状态看板 */
        .ov-board { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; padding:0 2px 4px; align-items:start; }
        .ov-col { background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); overflow:hidden; }
        .ov-col-h { display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--line-2); background:#fafbff; }
        .ov-col-name { font-size:13px; font-weight:700; color:var(--ink); }
        .ov-col-n { margin-left:auto; min-width:22px; height:20px; padding:0 7px; border-radius:999px; background:#eef1f6; color:var(--ink-2); font-size:12px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; font-variant-numeric:tabular-nums; }
        .ov-col-body { display:flex; flex-direction:column; gap:10px; padding:12px; min-height:92px; }
        .ov-col-empty { color:#c3c9d4; font-size:12.5px; text-align:center; padding:24px 0; }
        .ov-card { border:1px solid var(--line); border-radius:12px; padding:11px 12px; background:#fff; cursor:pointer; user-select:text; -webkit-user-select:text; transition:box-shadow .16s ease, transform .16s ease, border-color .16s ease, background .16s ease; }
        .ov-card:hover { border-color:var(--pri-100); background:#fafbff; box-shadow:0 10px 20px -14px rgba(15,23,42,.40); transform:translateY(-1px); }
        .ov-card-h { display:flex; align-items:center; justify-content:space-between; gap:8px; }
        .ov-card-no { font-size:13.5px; font-weight:700; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:text; user-select:text; -webkit-user-select:text; }
        .ov-card-route { margin-top:7px; font-size:12.5px; color:var(--ink-3); line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
        .ov-card-meta { margin-top:9px; display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
        .ov-card-fleet { color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        @media (max-width:1180px) {
            .ov-kpis { grid-template-columns:repeat(2,minmax(0,1fr)); }
            .ov-board { grid-template-columns:repeat(2,minmax(0,1fr)); }
        }
        @media (max-width:900px) {
            .app-shell { flex-direction:column; }
            .app-side { width:100%; flex:none; position:static; }
            .app-nav { flex-direction:row; flex-wrap:wrap; }
        }
        @media (max-width:620px) {
            .ov-kpis { grid-template-columns:1fr; }
            .ov-board { grid-template-columns:1fr; }
            .ov-empty { padding:40px 0 36px; }
        }
    </style>
</head>
<body>
    <div id="error-display">
        <h3>程序启动发生错误</h3>
        <pre id="error-message"></pre>
        <p>建议尝试：1. 刷新页面 2. 检查网络连接 3. 确保使用 Chrome/Edge 浏览器</p>
    </div>

    <div id="root">
        <div class="loading-container">
            <div id="loading-text">
                <div class="loading-spinner">●</div>
                <h3>系统正在加载中，请稍候...</h3>
                <p>首次加载可能需要几秒钟下载组件库</p>
            </div>
        </div>
    </div>
    
    <!-- 打印挂载点 -->
    <div id="print-root"></div>

    <script type="text/babel">
        // 确保 React 和 Antd 已加载
        if (!window.React || !window.antd) {
            throw new Error("React 或 Ant Design 库未能成功加载，请检查网络。");
        }

        const { useState, useEffect, useMemo } = React;
        const { 
            Button, Table, Modal, Form, Input, InputNumber, 
            Select, Tabs, Card, Space, message, Popconfirm, 
            Typography, List, Descriptions, Divider, Tag, Empty,
            ConfigProvider, DatePicker, AutoComplete, Checkbox
        } = antd;
        const { Title, Text } = Typography;

        // --- 打印模版组件 ---
        // 等 React 把打印内容真正渲染进 #print-root 后再执行回调。
        // 原来用固定 setTimeout(100ms) 就调 window.print()：首次生成派车单时同一帧还有
        // 表单重置、message 动画、Modal 关闭、订单写入等大量 React 更新，portal 往往还没
        // 渲染完，打印出来就是空白页（重新打印就好，是因为那时 DOM 已经在了）。
        // maxFrames 兜底：等满约 1.5 秒也照样打印，不会卡死。
        const waitPrintReady = (expectedKey, callback, maxFrames = 90) => {
            let frames = 0;
            // 打印内容里的 <img> 必须解码完成，否则快照会拍到空图（原来只看 DOM 有没有）
            const imagesReady = () => {
                const imgs = document.querySelectorAll('#print-root img');
                for (let i = 0; i < imgs.length; i++) {
                    if (!imgs[i].complete || !imgs[i].naturalWidth) return false;
                }
                return true;
            };
            const isReady = () => {
                const root = document.getElementById('print-root');
                if (!root || !root.firstElementChild) return false;
                if (expectedKey && root.firstElementChild.getAttribute('data-print-key') !== expectedKey) return false;
                return imagesReady();
            };
            const tick = () => {
                if (isReady() || ++frames >= maxFrames) { callback(); return; }
                requestAnimationFrame(tick);
            };
            requestAnimationFrame(tick);
        };

        // OIA Global logo（内联矢量，不依赖网络）。
        // 原来这里是 <img src="https://www.oiaglobal.com/...OIA-Global.svg">：img 元素在点打印时才创建，
        // 远程 SVG 冷加载约 1 秒，而 waitPrintReady 只等 DOM 节点出现就 print()，

        const DispatchSheetPrint = ({ data, addresses }) => {
            if (!data) return null;

            const getAddr = (id) => addresses.find(a => a.id === id) || {};

            return (
                <div data-print-key={data.shipmentId || data.poNumber || data.routeName || ''} style={{ padding: '40px', fontFamily: '"Microsoft YaHei", "SimHei", sans-serif', color: '#000', fontSize: '14px', lineHeight: '1.5' }}>
                    
                    {/* Header */}
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', borderBottom: '3px solid #000', paddingBottom: '20px', marginBottom: '30px' }}>
                        <div style={{ backgroundColor: '#000', padding: '10px 20px', display: 'flex', alignItems: 'center' }}>
                            <span role="img" aria-label="OIA Global" style={{ display: 'inline-block', width: '307px', height: '50px', lineHeight: 0 }} dangerouslySetInnerHTML={{ __html: OIA_LOGO_SVG }} />
                        </div>
                        <div>
                            <h1 style={{ fontSize: '42px', fontWeight: '900', letterSpacing: '8px', margin: 0, lineHeight: 1 }}>派车单</h1>
                        </div>
                    </div>

                    {/* Basic Info Grid */}
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '25px', marginBottom: '30px' }}>
                        <div style={{ borderBottom: '1px solid #ccc', paddingBottom: '5px' }}>
                            <div style={{ fontSize: '12px', color: '#666', marginBottom: '4px' }}>Shipment ID</div>
                            <div style={{ fontSize: '16px', fontWeight: 'bold' }}>{data.shipmentId || '-'}</div>
                        </div>
                        <div style={{ borderBottom: '1px solid #ccc', paddingBottom: '5px' }}>
                            <div style={{ fontSize: '12px', color: '#666', marginBottom: '4px' }}>PO 号码</div>
                            <div style={{ fontSize: '16px', fontWeight: 'bold' }}>{data.poNumber || '-'}</div>
                        </div>
                        <div style={{ borderBottom: '1px solid #ccc', paddingBottom: '5px' }}>
                            <div style={{ fontSize: '12px', color: '#666', marginBottom: '4px' }}>承运车队</div>
                            <div style={{ fontSize: '16px', fontWeight: 'bold' }}>{data.fleet || '-'}</div>
                        </div>
                        <div style={{ borderBottom: '1px solid #ccc', paddingBottom: '5px' }}>
                            <div style={{ fontSize: '12px', color: '#666', marginBottom: '4px' }}>车型</div>
                            <div style={{ fontSize: '16px', fontWeight: 'bold' }}>{data.vehicleType || '-'}</div>
                        </div>
                        <div style={{ borderBottom: '1px solid #ccc', paddingBottom: '5px' }}>
                            <div style={{ fontSize: '12px', color: '#666', marginBottom: '4px' }}>提货日期</div>
                            <div style={{ fontSize: '16px', fontWeight: 'bold' }}>{data.pickupDate ? dayjs(data.pickupDate).format('YYYY-MM-DD') : '-'}</div>
                        </div>
                        <div style={{ borderBottom: '1px solid #ccc', paddingBottom: '5px' }}>
                            <div style={{ fontSize: '12px', color: '#666', marginBottom: '4px' }}>送货日期</div>
                            <div style={{ fontSize: '16px', fontWeight: 'bold' }}>{data.deliveryDate ? dayjs(data.deliveryDate).format('YYYY-MM-DD') : '-'}</div>
                        </div>
                    </div>

                    {/* Stops Section */}
                    <div style={{ marginBottom: '30px' }}>
                        <div style={{ backgroundColor: '#f5f5f5', color: '#000', padding: '8px 15px', fontWeight: 'bold', fontSize: '16px', marginBottom: '0', display: 'flex', alignItems: 'center', borderTop: '1px solid #000', borderLeft: '1px solid #000', borderRight: '1px solid #000' }}>
                            <span style={{ marginRight: '10px' }}>📍</span> 路线详情
                        </div>
                        <table style={{ width: '100%', borderCollapse: 'collapse', border: '1px solid #000' }}>
                            <thead>
                                <tr style={{ backgroundColor: '#fff', borderBottom: '2px solid #000' }}>
                                    <th style={{ padding: '12px', textAlign: 'center', width: '50px', borderRight: '1px solid #ddd', fontWeight: 'bold' }}>序号</th>
                                    <th style={{ padding: '12px', textAlign: 'left', borderRight: '1px solid #ddd', fontWeight: 'bold' }}>地址信息</th>
                                    <th style={{ padding: '12px', textAlign: 'left', width: '200px', fontWeight: 'bold' }}>联系方式</th>
                                </tr>
                            </thead>
                            <tbody>
                                {data.stops && data.stops.map((stop, index) => {
                                    const addr = getAddr(stop.addressId);
                                    return (
                                        <tr key={index} style={{ borderBottom: '1px solid #ddd' }}>
                                            <td style={{ padding: '12px', textAlign: 'center', borderRight: '1px solid #ddd', fontWeight: 'bold' }}>{index + 1}</td>
                                            <td style={{ padding: '12px', borderRight: '1px solid #ddd' }}>
                                                <div style={{ fontSize: '15px', fontWeight: 'bold', marginBottom: '4px' }}>{addr.name}</div>
                                                <div style={{ fontSize: '13px', color: '#444' }}>{addr.location}</div>
                                            </td>
                                            <td style={{ padding: '12px' }}>
                                                <div style={{ fontSize: '14px', fontWeight: 'bold', marginBottom: '2px' }}>{addr.contactPerson}</div>
                                                <div style={{ fontSize: '13px' }}>{addr.contactInfo}</div>
                                            </td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>

                    {/* Cargo Section */}
                    <div style={{ marginBottom: '30px' }}>
                        <div style={{ backgroundColor: '#f5f5f5', color: '#000', padding: '8px 15px', fontWeight: 'bold', fontSize: '16px', marginBottom: '0', display: 'flex', alignItems: 'center', borderTop: '1px solid #000', borderLeft: '1px solid #000', borderRight: '1px solid #000' }}>
                            <span style={{ marginRight: '10px' }}>📦</span> 货物信息
                        </div>
                        <table style={{ width: '100%', borderCollapse: 'collapse', border: '1px solid #000' }}>
                            <thead>
                                <tr style={{ backgroundColor: '#fff', borderBottom: '2px solid #000' }}>
                                    <th style={{ padding: '10px', textAlign: 'left', borderRight: '1px solid #ddd' }}>货物描述</th>
                                    <th style={{ padding: '10px', textAlign: 'center', width: '100px', borderRight: '1px solid #ddd' }}>件数</th>
                                    <th style={{ padding: '10px', textAlign: 'center', width: '100px', borderRight: '1px solid #ddd' }}>重量 (KG)</th>
                                    <th style={{ padding: '10px', textAlign: 'center', width: '100px' }}>体积 (CBM)</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td style={{ padding: '15px', borderRight: '1px solid #ddd', fontSize: '15px' }}>{data.cargoDescription || '-'}</td>
                                    <td style={{ padding: '15px', textAlign: 'center', borderRight: '1px solid #ddd', fontWeight: 'bold', fontSize: '16px' }}>{data.cargoCount || '-'}</td>
                                    <td style={{ padding: '15px', textAlign: 'center', borderRight: '1px solid #ddd', fontWeight: 'bold', fontSize: '16px' }}>{data.cargoWeight || '-'}</td>
                                    <td style={{ padding: '15px', textAlign: 'center', fontWeight: 'bold', fontSize: '16px' }}>{data.cargoCbm || '-'}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    {/* Notes Section */}
                    <div>
                        <div style={{ backgroundColor: '#f5f5f5', color: '#000', padding: '8px 15px', fontWeight: 'bold', fontSize: '16px', marginBottom: '0', display: 'flex', alignItems: 'center', border: '1px solid #000', borderBottom: 'none' }}>
                            <span style={{ marginRight: '10px' }}>📝</span> 备注信息
                        </div>
                        <div style={{ border: '1px solid #000', borderTop: '1px solid #000', padding: '15px', minHeight: '100px', whiteSpace: 'pre-wrap', fontSize: '14px', lineHeight: '1.6', backgroundColor: '#fff' }}>
                            {data.note || '无'}
                        </div>
                    </div>
                </div>
            );
        };

        // --- 数据存储层 (LocalStorage & IndexedDB) ---
        const DB_KEYS = {
            ADDRESSES: 'dispatch_addresses',
            ROUTES: 'dispatch_routes',
            ORDERS: 'dispatch_orders',
            FLEETS: 'dispatch_fleets'
        };

        const initDB = () => {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('DispatchSystemDB', 1);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('backups')) {
                        db.createObjectStore('backups', { keyPath: 'timestamp' });
                    }
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        };

        const backupDataToIndexedDB = async () => {
            try {
                const db = await initDB();
                const transaction = db.transaction(['backups'], 'readwrite');
                const store = transaction.objectStore('backups');
                const backupData = {
                    timestamp: new Date().toISOString(),
                    addresses: getAddresses(),
                    routes: getRoutes(),
                    orders: getOrders(),
                    fleets: getFleets()
                };
                store.put(backupData);
                
                // 保留最近 20 条备份记录
                const countReq = store.count();
                countReq.onsuccess = () => {
                    if (countReq.result > 20) {
                        const cursorReq = store.openCursor();
                        let deleteCount = countReq.result - 20;
                        cursorReq.onsuccess = (e) => {
                            const cursor = e.target.result;
                            if (cursor && deleteCount > 0) {
                                cursor.delete();
                                deleteCount--;
                                cursor.continue();
                            }
                        };
                    }
                };
            } catch (err) {
                console.error('IndexedDB 备份失败', err);
            }
        };

        const debounceBackup = (() => {
            let timer = null;
            return () => {
                if (timer) clearTimeout(timer);
                timer = setTimeout(backupDataToIndexedDB, 2000);
            };
        })();

        const getAddresses = () => {
            try {
                return JSON.parse(localStorage.getItem(DB_KEYS.ADDRESSES) || '[]');
            } catch (e) { return []; }
        };
        const saveAddresses = (data) => {
            localStorage.setItem(DB_KEYS.ADDRESSES, JSON.stringify(data));
            debounceBackup();
        };

        const getFleets = () => {
            try {
                return JSON.parse(localStorage.getItem(DB_KEYS.FLEETS) || '[]');
            } catch (e) { return []; }
        };
        const saveFleets = (data) => {
            localStorage.setItem(DB_KEYS.FLEETS, JSON.stringify(data));
            debounceBackup();
        };

        const getRoutes = () => {
            try {
                return JSON.parse(localStorage.getItem(DB_KEYS.ROUTES) || '[]');
            } catch (e) { return []; }
        };
        const saveRoutes = (data) => {
            localStorage.setItem(DB_KEYS.ROUTES, JSON.stringify(data));
            debounceBackup();
        };

        const getOrders = () => {
            try {
                return JSON.parse(localStorage.getItem(DB_KEYS.ORDERS) || '[]');
            } catch (e) { return []; }
        };
        const saveOrders = (data) => {
            localStorage.setItem(DB_KEYS.ORDERS, JSON.stringify(data));
            debounceBackup();
        };

        // --- 组件定义 ---

        // 4. 派车单生成组件 (新增)
        const DispatchGenerator = ({ routes, addresses, setAddresses, setPrintData, editingOrder, onOrderComplete, onCancelEdit }) => {
            const [form] = Form.useForm();
            const [selectedRoute, setSelectedRoute] = useState(null);
            const [currentStops, setCurrentStops] = useState([]);
            const [draggedIndex, setDraggedIndex] = useState(null);
            const [fleets, setFleets] = useState([]);
            const [isPreOrder, setIsPreOrder] = useState(false);
            // true 表示提醒日期仍由提货日期自动推算；用户手动改过后置 false
            const reminderAutoRef = React.useRef(true);
            // 线路名称是否自动生成（用户手动改过或选了模板后置 false）
            const routeNameAutoRef = React.useRef(true);

            // 加载车队历史记录
            useEffect(() => {
                setFleets(getFleets());
            }, []);

            // 线路名称自动生成：按站点简称拼接「简称-简称-简称」
            const buildStopsRouteName = (stopsList) => (stopsList || [])
                .map(s => {
                    const a = addresses.find(x => x.id === s.addressId);
                    if (!a) return '';
                    return (a.shortName || a.name || '').trim();
                })
                .filter(Boolean)
                .join('-');

            // 合并站点地址的「默认备注」到备注栏（去重，不动其它内容）
            const mergeAddressNotes = (baseNote, stopsList) => {
                let text = (baseNote || '').trim();
                (stopsList || []).forEach(s => {
                    const a = addresses.find(x => x.id === s.addressId);
                    const n = a && a.note ? String(a.note).trim() : '';
                    if (n && text.indexOf(n) < 0) {
                        text = text ? (text + '\n' + n) : n;
                    }
                });
                return text;
            };

            useEffect(() => {
                if (!routeNameAutoRef.current) return;
                form.setFieldsValue({ routeName: buildStopsRouteName(currentStops) });
            }, [currentStops, addresses]);

            // 监听编辑状态
            useEffect(() => {
                if (editingOrder) {
                    setIsPreOrder(!!editingOrder.isPreOrder);
                    fillFormFromOrder(editingOrder);
                }
            }, [editingOrder, form, routes]);

            const fillFormFromOrder = (order) => {
                // 编辑已有预定单时保留其提醒日期；没有则继续保持自动推算
                reminderAutoRef.current = !order.reminderDate;
                routeNameAutoRef.current = !order.routeName;
                // 填充表单
                form.setFieldsValue({
                    isPreOrder: !!order.isPreOrder,
                    reminderDate: order.reminderDate ? dayjs(order.reminderDate) : null,
                    routeSelect: order.routeSelect, // 尝试保留选择状态
                    routeName: order.routeName || '',
                    shipmentId: order.shipmentId,
                    poNumber: order.poNumber,
                    fleet: order.fleet,
                    vehicleType: order.vehicleType,
                    pickupDate: order.pickupDate ? dayjs(order.pickupDate) : null,
                    deliveryDate: order.deliveryDate ? dayjs(order.deliveryDate) : null,
                    cargoDescription: order.cargoDescription,
                    cargoCount: order.cargoCount,
                    cargoCbm: order.cargoCbm,
                    cargoWeight: order.cargoWeight,
                    note: order.note
                });
                
                // 恢复路线选择状态 (如果存在)
                if (order.routeSelect) {
                     const route = routes.find(r => r.id === order.routeSelect);
                     if (route) setSelectedRoute(route);
                     else setSelectedRoute({ name: order.routeName }); // Fallback name
                } else {
                     setSelectedRoute({ name: order.routeName });
                }

                // 恢复站点
                setCurrentStops((order.stops || []).map((s, i) => ({
                    key: Date.now() + i,
                    addressId: s.addressId,
                    type: s.type || (i === 0 ? 'pickup' : (i === (order.stops || []).length - 1 ? 'delivery' : 'logistics'))
                })));
                message.info('已加载订单数据');
            };

            const handleOrderLookup = (type, val) => {
                if (!val || editingOrder) return;
                
                const orders = getOrders();
                const historyOrder = orders.find(o => o[type] === val);
                if (historyOrder) {
                    const label = type === 'shipmentId' ? 'Shipment ID' : 'PO 号码';
                    Modal.confirm({
                        title: '发现历史订单记录',
                        content: `找到相同 ${label} (${val}) 的历史记录，是否自动带出当时的信息？`,
                        onOk: () => fillFormFromOrder(historyOrder)
                    });
                }
            };

            const handleShipmentBlur = (e) => handleOrderLookup('shipmentId', e.target.value);
            const handlePoBlur = (e) => handleOrderLookup('poNumber', e.target.value);

            const handleRouteSelect = (routeId) => {
                const route = routes.find(r => r.id === routeId);
                if (route) {
                    setSelectedRoute(route);
                    // 选了线路模板：用模板名，停止按站点自动生成
                    routeNameAutoRef.current = false;
                    form.setFieldsValue({ routeName: route.name || '' });
                    const mappedStops = route.stops.map((s, i) => ({ 
                        key: Date.now() + i, 
                        addressId: s.addressId,
                        type: s.type || (i === 0 ? 'pickup' : (i === route.stops.length - 1 ? 'delivery' : 'logistics'))
                    }));
                    setCurrentStops(mappedStops);
                    
                    // 自动填充表单
                    const currentValues = form.getFieldsValue();
                    const updates = {
                        cargoDescription: route.cargo?.description,
                        cargoCount: route.cargo?.count,
                        cargoCbm: route.cargo?.cbm,
                        cargoWeight: route.cargo?.weight,
                        note: mergeAddressNotes(route.cargo?.note, mappedStops),
                        fleet: currentValues.fleet || route.fleet,
                        vehicleType: currentValues.vehicleType || route.vehicleType
                    };

                    if (typeof route.transitDays === 'number' && currentValues.pickupDate) {
                        updates.deliveryDate = dayjs(currentValues.pickupDate).add(route.transitDays, 'day');
                    }

                    form.setFieldsValue(updates);

                    if ((updates.note || '') !== (route.cargo?.note || '')) {
                        message.info('已自动带出站点默认备注');
                    }

                    if (typeof route.transitDays === 'number' && currentValues.pickupDate) {
                        message.success(`已自动加载线路信息，并根据时效(+${route.transitDays}天)设置送货日期`);
                    } else {
                        message.success('已自动加载线路信息');
                    }

                    // Check for internal precautions
                    const precautionsList = [];
                    route.stops.forEach(s => {
                        const addr = addresses.find(a => a.id === s.addressId);
                        if (addr && addr.precautions) {
                            precautionsList.push({ name: addr.name, text: addr.precautions });
                        }
                    });

                    if (precautionsList.length > 0) {
                        Modal.warning({
                            title: '⚠️ 内部注意事项提醒',
                            content: (
                                <div style={{marginTop: 16}}>
                                    <p style={{marginBottom: 8, color: '#666'}}>此路线包含以下需要特别注意的地址：</p>
                                    <ul style={{ paddingLeft: 20, margin: 0 }}>
                                        {precautionsList.map((p, idx) => (
                                            <li key={idx} style={{marginBottom: 8}}><strong>{p.name}:</strong> <span style={{color: '#cf1322'}}>{p.text}</span></li>
                                        ))}
                                    </ul>
                                </div>
                            ),
                            okText: '已了解',
                            width: 500
                        });
                    }
                }
            };

            const handleAddStop = () => {
                let defaultType = 'logistics';
                if (currentStops.length === 0) defaultType = 'pickup';
                else defaultType = 'delivery';
                setCurrentStops([...currentStops, { key: Date.now(), addressId: null, type: defaultType }]);
            };

            const handleRemoveStop = (index) => {
                const newStops = [...currentStops];
                newStops.splice(index, 1);
                setCurrentStops(newStops);
            };

            const handleDragStart = (e, index) => {
                setDraggedIndex(index);
                e.dataTransfer.effectAllowed = 'move';
                // Some browsers require setData to allow drag
                e.dataTransfer.setData('text/plain', index);
            };

            const handleDragOver = (e, index) => {
                e.preventDefault();
                if (draggedIndex === null || draggedIndex === index) return;
                
                const newStops = [...currentStops];
                const draggedItem = newStops[draggedIndex];
                newStops.splice(draggedIndex, 1);
                newStops.splice(index, 0, draggedItem);
                
                setCurrentStops(newStops);
                setDraggedIndex(index);
            };

            const handleDragEnd = () => {
                setDraggedIndex(null);
            };

            const handleStopTypeChange = (index, val) => {
                const newStops = [...currentStops];
                newStops[index].type = val;
                setCurrentStops(newStops);
            };

            const handleStopChange = (index, value) => {
                const newStops = [...currentStops];
                newStops[index].addressId = value;
                
                const addr = addresses.find(a => a.id === value);
                if (addr) {
                    // 智能识别物流园/仓库
                    const keywords = ['物流园', '物流中心', '保税仓', '仓库', '仓储', '堆场', 'Park', 'Logistics', 'Warehouse', 'Bonded', 'Depot'];
                    const text = ((addr.name || '') + (addr.location || '')).toLowerCase();
                    if (keywords.some(k => text.includes(k.toLowerCase()))) {
                        newStops[index].type = 'logistics';
                        message.success(`已自动识别为物流园: ${addr.name}`);
                    }

                    if (addr.note) {
                        const currentNote = form.getFieldValue('note') || '';
                        if (!currentNote.includes(addr.note)) {
                            const newNote = currentNote ? `${currentNote}\n${addr.note}` : addr.note;
                            form.setFieldsValue({ note: newNote });
                            message.info(`已自动添加地址备注: ${addr.note}`);
                        }
                    }

                    if (addr.precautions) {
                        Modal.warning({
                            title: `⚠️ 内部注意事项提醒 - ${addr.name}`,
                            content: (
                                <div style={{marginTop: 16, color: '#cf1322', fontSize: 16}}>
                                    {addr.precautions}
                                </div>
                            ),
                            okText: '已了解'
                        });
                    }
                }
                setCurrentStops(newStops);
            };

            const getAddressDetails = (addressId) => addresses.find(a => a.id === addressId) || {};

            const handleReset = () => {
                form.resetFields();
                setSelectedRoute(null);
                routeNameAutoRef.current = true;
                setCurrentStops([]);
                setPrintData(null);
                setIsPreOrder(false);
                reminderAutoRef.current = true; // 重置后提醒日期恢复自动推算
                message.success('已重置');
            };

            // 预定单提醒日期规则：提货日期前 1 天，遇周末自动提前到最近的周五（与总览「准备派车」口径一致）
            const getDefaultReminderDate = (pickupDate) => {
                if (!pickupDate) return null;
                let d = dayjs(pickupDate).startOf('day').subtract(1, 'day');
                if (d.day() === 6) d = d.subtract(1, 'day');      // 周六 -> 周五
                else if (d.day() === 0) d = d.subtract(2, 'day'); // 周日 -> 周五
                return d;
            };

            // 提货日期变化时自动带出提醒日期（仅当用户没有手动改过）
            const applyAutoReminderDate = (pickupDate) => {
                if (!form.getFieldValue('isPreOrder') || !pickupDate) return;
                if (!reminderAutoRef.current) return;
                const auto = getDefaultReminderDate(pickupDate);
                if (auto) form.setFieldsValue({ reminderDate: auto });
            };

            const handlePickupDateChange = (date) => {
                if (!date) return;

                // 预定单：提醒日期默认取提货日期前 1~2 天（自动跳过周末）
                applyAutoReminderDate(date);

                const currentRouteId = form.getFieldValue('routeSelect');
                if (!currentRouteId) return;
                
                const route = routes.find(r => r.id === currentRouteId);
                if (route && typeof route.transitDays === 'number') {
                    const newDeliveryDate = date.add(route.transitDays, 'day');
                    form.setFieldsValue({ deliveryDate: newDeliveryDate });
                    message.success(`已根据路线时效(+${route.transitDays}天)自动设置送货日期`);
                }
            };

            const activePrecautions = currentStops
                .map(s => addresses.find(a => a.id === s.addressId))
                .filter(a => a && a.precautions)
                .map(a => ({ name: a.name, text: a.precautions }));

            const handleDeleteFleet = (fleetValue) => {
                const newFleets = fleets.filter(f => f.value !== fleetValue);
                setFleets(newFleets);
                saveFleets(newFleets);
                message.success('已删除车队记录');
            };

            const handleGenerate = () => {
                form.validateFields().then(values => {
                    const routeName = (values.routeName || '').trim() || selectedRoute?.name || buildStopsRouteName(currentStops) || '';
                    
                    // --- 保存新车队 ---
                    const newFleet = values.fleet;
                    if (newFleet && !fleets.some(f => f.value === newFleet)) {
                        const updatedFleets = [...fleets, { value: newFleet }];
                        setFleets(updatedFleets);
                        saveFleets(updatedFleets);
                    }

                    const data = {
                        ...values,
                        isDraft: false,
                        reminderDate: values.reminderDate ? values.reminderDate.toISOString() : null,
                        stops: currentStops.map(s => ({
                            addressId: s.addressId,
                            type: s.type || 'logistics'
                        })),
                        routeName: routeName
                    };
                    setPrintData(data);
                    
                    // --- 订单记录逻辑 ---
                    const orders = getOrders();
                    const now = new Date().toISOString();
                    
                    if (editingOrder) {
                        // 更新现有订单
                        const updatedOrders = orders.map(o => o.id === editingOrder.id ? { ...o, ...data, updatedAt: now } : o);
                        saveOrders(updatedOrders);
                        message.success('订单记录已更新');
                        if (onOrderComplete) onOrderComplete();
                    } else {
                        // 创建新订单
                        const newOrder = {
                            id: Date.now().toString(),
                            createdAt: now,
                            updatedAt: now,
                            ...data
                        };
                        saveOrders([newOrder, ...orders]); // 新订单排在最前
                        message.success(values.isPreOrder ? '已保存为预定单' : '已自动保存到订单记录');
                        if (values.isPreOrder && onOrderComplete) {
                            onOrderComplete();
                            return; // 预定单不打印
                        }
                    }

                    if (values.isPreOrder) return; // 预定单编辑保存后也不打印

                    // 构造文件名: 派车单-单号(Shipment优先)-提货日期-车型-路线名称
                    const identifier = values.shipmentId || values.poNumber || '无单号';
                    const pickupDate = values.pickupDate ? dayjs(values.pickupDate).format('YYYY-MM-DD') : '无日期';
                    const vehicleType = values.vehicleType || '无车型';
                    const safeRouteName = routeName || '无路线';
                    
                    const fileName = `派车单-${identifier}-${pickupDate}-${vehicleType}-${safeRouteName}`;
                    
                    // 保存原有标题并设置新标题
                    const oldTitle = document.title;
                    document.title = fileName;

                    // 等打印内容真正渲染进 #print-root 再打印（固定延时在首次生成时会打出空白页）
                    waitPrintReady(data.shipmentId || data.poNumber || data.routeName || '', () => {
                        window.print();

                        // 打印对话框关闭后恢复标题 (延迟执行以确保打印对话框已获取到标题)
                        setTimeout(() => {
                            document.title = oldTitle;
                        }, 1000);
                    });
                });
            };

            const handleSaveDraft = () => {
                const values = form.getFieldsValue(true);
                const routeId = values.routeSelect;
                const routeName = (values.routeName || '').trim()
                    || (routeId ? (routes.find(r => r.id === routeId)?.name || selectedRoute?.name || '') : (selectedRoute?.name || ''))
                    || buildStopsRouteName(currentStops)
                    || '';

                // 保存新输入的承运车队 (与正式单保持一致)
                const newFleet = values.fleet;
                if (newFleet && !fleets.some(f => f.value === newFleet)) {
                    const updatedFleets = [...fleets, { value: newFleet }];
                    setFleets(updatedFleets);
                    saveFleets(updatedFleets);
                }

                const now = new Date().toISOString();
                const data = {
                    ...values,
                    isDraft: true,
                    reminderDate: values.reminderDate ? values.reminderDate.toISOString() : null,
                    stops: currentStops.map(s => ({
                        addressId: s.addressId,
                        type: s.type || 'logistics'
                    })),
                    routeName: routeName
                };

                const orders = getOrders();
                if (editingOrder) {
                    const updatedOrders = orders.map(o => o.id === editingOrder.id ? { ...o, ...data, isDraft: true, updatedAt: now } : o);
                    saveOrders(updatedOrders);
                    message.success('草稿已更新');
                } else {
                    const newOrder = {
                        id: Date.now().toString(),
                        createdAt: now,
                        updatedAt: now,
                        ...data
                    };
                    saveOrders([newOrder, ...orders]);
                    message.success('已保存为草稿，可在「订单记录」继续完善');
                }
            };

            const handleParseText = (text) => {
                if (!text) return;
                
                let parsedName = '';
                let parsedLocation = '';
                let parsedPerson = '';
                let parsedPhone = '';

                const phoneMatch = text.match(/(?:1[3-9]\d{9})/);
                if (phoneMatch) {
                    parsedPhone = phoneMatch[0];
                    text = text.replace(parsedPhone, '');
                }

                const parts = text.split(/[,，\s\n]+/).map(p => p.trim()).filter(Boolean);

                parts.forEach(part => {
                    if (!part) return;
                    if (part.includes('省') || part.includes('市') || part.includes('区') || part.includes('县') || part.includes('镇') || part.includes('路')) {
                        parsedLocation = part;
                    } else if (part.length >= 2 && part.length <= 4 && !/\d/.test(part) && !parsedPerson) {
                        parsedPerson = part;
                    } else if (!parsedName) {
                        parsedName = part;
                    }
                });

                const currentValues = quickAddressForm.getFieldsValue();
                quickAddressForm.setFieldsValue({
                    name: currentValues.name || parsedName,
                    location: currentValues.location || parsedLocation,
                    contactPerson: currentValues.contactPerson || parsedPerson,
                    contactInfo: currentValues.contactInfo || parsedPhone,
                });
                
                message.success('文本解析完成，请核对信息');
            };

            const handleQuickAddressSave = () => {
                quickAddressForm.validateFields().then(values => {
                    const newAddr = { id: Date.now().toString(), ...values };
                    const newAddresses = [...addresses, newAddr];
                    saveAddresses(newAddresses);
                    if (setAddresses) setAddresses(newAddresses);
                    
                    const defaultType = currentStops.length === 0 ? 'pickup' : 'delivery';
                    setCurrentStops([...currentStops, { key: Date.now(), addressId: newAddr.id, type: defaultType }]);
                    
                    setIsQuickAddressModalOpen(false);
                    quickAddressForm.resetFields();
                    message.success('地址已创建并添加到站点');
                });
            };

            return (
                <div>
                    <div className="page-head">
                        <div className="page-head-l">
                            <div className="page-title"><span className="pi">{React.createElement(icons.FileAddOutlined)}</span>派车单生成</div>
                            <div className="page-sub">选择线路与单据类型，填写货物、站点信息，生成可打印派车单</div>
                        </div>
                    </div>

                    <Card bordered={false} style={{ marginBottom: 24, boxShadow: '0 1px 2px 0 rgba(0, 0, 0, 0.05)' }}>
                        <div className="sec-h"><span className="si">{React.createElement(icons.ProfileOutlined)}</span>线路与单据信息</div>
                        
                        <Form form={form} layout="vertical" onValuesChange={(changed) => { if (Object.prototype.hasOwnProperty.call(changed, 'routeName')) routeNameAutoRef.current = false; }}>
                            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 16, marginBottom: 16, alignItems: 'start' }}>
                                <Form.Item name="routeSelect" label="选择线路（可选）" style={{ marginBottom: 0 }} extra="不选也可以：填好下面的站点，线路名称会自动生成">
                                    <Select 
                                        showSearch
                                        placeholder="请选择一条线路..."
                                        optionFilterProp="children"
                                        onChange={handleRouteSelect}
                                        size="large"
                                        variant="filled"
                                        style={{ fontWeight: 500 }}
                                    >
                                        {routes.map(r => (
                                            <Select.Option key={r.id} value={r.id}>
                                                {r.name}
                                            </Select.Option>
                                        ))}
                                    </Select>
                                </Form.Item>
                                <Form.Item name="routeName" label="线路名称" style={{ marginBottom: 0 }} extra="选完站点自动按「简称-简称-简称」生成，也可手动修改">
                                    <Input size="large" variant="filled" placeholder="例如：正盛-厦门物流园-协丰" />
                                </Form.Item>
                                <Form.Item
                                    name="isPreOrder"
                                    label="单据类型"
                                    style={{ marginBottom: 0 }}
                                    initialValue={false}
                                    extra={isPreOrder ? <span style={{ fontSize: 12, color: '#d4380d' }}>先登记，暂不派车</span> : null}
                                >
                                    <antd.Segmented
                                        block
                                        size="large"
                                        options={[
                                            { label: '正式派车单', value: false },
                                            { label: '预定单', value: true }
                                        ]}
                                        onChange={(val) => {
                                            const pre = !!val;
                                            setIsPreOrder(pre);
                                            // 切到预定单时，若已填提货日期则自动带出提醒日期
                                            if (pre) {
                                                if (!form.getFieldValue('reminderDate')) reminderAutoRef.current = true;
                                                applyAutoReminderDate(form.getFieldValue('pickupDate'));
                                            }
                                        }}
                                    />
                                </Form.Item>
                                {isPreOrder && (
                                    <Form.Item
                                        name="reminderDate"
                                        label="提醒派车日期"
                                        rules={[{ required: true, message: '请选择提醒日期' }]}
                                        style={{ marginBottom: 0 }}
                                        extra={<span style={{ fontSize: 12, color: '#9ca3af' }}>默认按提货日提前 1~2 天自动推算，可手动修改</span>}
                                    >
                                        <DatePicker
                                            size="large"
                                            variant="filled"
                                            style={{width: '100%'}}
                                            placeholder="默认按提货日推算"
                                            onChange={() => { reminderAutoRef.current = false; }}
                                        />
                                    </Form.Item>
                                )}
                            </div>

                            <div style={{ marginTop: 0 }}>
                                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '16px', marginBottom: '16px' }}>
                                    <Form.Item 
                                        name="shipmentId" 
                                        label="Shipment" 
                                        style={{ marginBottom: 0 }}
                                        rules={[
                                            ({ getFieldValue }) => ({
                                                validator(_, value) {
                                                    if (value || getFieldValue('poNumber')) {
                                                        return Promise.resolve();
                                                    }
                                                    return Promise.reject(new Error('Shipment ID 或 PO 号码至少填写一项'));
                                                },
                                            }),
                                        ]}
                                    >
                                        <Input size="large" variant="filled" placeholder="请输入 Shipment ID" onBlur={handleShipmentBlur} />
                                    </Form.Item>
                                    <Form.Item 
                                        name="poNumber" 
                                        label="PO" 
                                        style={{ marginBottom: 0 }}
                                        rules={[
                                            ({ getFieldValue }) => ({
                                                validator(_, value) {
                                                    if (value || getFieldValue('shipmentId')) {
                                                        return Promise.resolve();
                                                    }
                                                    return Promise.reject(new Error('Shipment ID 或 PO 号码至少填写一项'));
                                                },
                                            }),
                                        ]}
                                    >
                                        <Input size="large" variant="filled" placeholder="请输入 PO Number" onBlur={handlePoBlur} />
                                    </Form.Item>
                                    <Form.Item 
                                        name="fleet" 
                                        label="承运车队" 
                                        style={{ marginBottom: 0 }}
                                        rules={[{ required: !isPreOrder, message: '请输入承运车队' }]}
                                    >
                                        <AutoComplete
                                            options={fleets.map(f => ({
                                                value: f.value,
                                                label: (
                                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                                        <span>{f.value}</span>
                                                        <span 
                                                            onClick={(e) => {
                                                                e.stopPropagation();
                                                                e.preventDefault();
                                                                handleDeleteFleet(f.value);
                                                            }}
                                                            style={{ 
                                                                color: '#999', 
                                                                cursor: 'pointer', 
                                                                padding: '0 8px',
                                                                fontSize: '16px',
                                                                fontWeight: 'bold'
                                                            }}
                                                            title="删除此记录"
                                                            onMouseEnter={(e) => e.target.style.color = '#ff4d4f'}
                                                            onMouseLeave={(e) => e.target.style.color = '#999'}
                                                        >
                                                            ×
                                                        </span>
                                                    </div>
                                                )
                                            }))}
                                            filterOption={(inputValue, option) =>
                                                option.value.toUpperCase().indexOf(inputValue.toUpperCase()) !== -1
                                            }
                                            size="large"
                                            variant="filled"
                                            placeholder="输入或选择车队"
                                        />
                                    </Form.Item>
                                </div>

                                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '16px', marginBottom: '24px' }}>
                                    <Form.Item 
                                        name="vehicleType" 
                                        label="车型" 
                                        style={{ marginBottom: 0 }}
                                        rules={[{ required: !isPreOrder, message: '请输入车型' }]}
                                    >
                                        <Input size="large" variant="filled" placeholder="例如：2台5吨车 / 40HQ" />
                                    </Form.Item>
                                    <Form.Item 
                                        name="pickupDate" 
                                        label="提货日期" 
                                        style={{ marginBottom: 0 }}
                                        rules={[{ required: !isPreOrder, message: '请选择提货日期' }]}
                                    >
                                        <DatePicker size="large" variant="filled" style={{width: '100%'}} placeholder="选择提货日期" onChange={handlePickupDateChange} />
                                    </Form.Item>
                                    <Form.Item 
                                        name="deliveryDate" 
                                        label="送货日期" 
                                        style={{ marginBottom: 0 }}
                                        rules={[{ required: !isPreOrder, message: '请选择送货日期' }]}
                                    >
                                        <DatePicker size="large" variant="filled" style={{width: '100%'}} placeholder="选择送货日期" />
                                    </Form.Item>
                                </div>

                                <Divider orientation="left">站点管理</Divider>
                                <div style={{ backgroundColor: '#f9fafb', padding: 16, borderRadius: 8, borderWidth: 1, borderColor: '#f3f4f6', borderStyle: 'solid', marginBottom: 24 }}>
                                    {currentStops.length > 0 ? (
                                        currentStops.map((stop, index) => (
                                            <div 
                                                key={stop.key} 
                                                draggable
                                                onDragStart={(e) => handleDragStart(e, index)}
                                                onDragOver={(e) => handleDragOver(e, index)}
                                                onDragEnd={handleDragEnd}
                                                style={{ 
                                                    display: 'flex', gap: 16, marginBottom: 16, alignItems: 'start',
                                                    opacity: draggedIndex === index ? 0.5 : 1,
                                                    cursor: 'grab',
                                                    transition: 'opacity 0.2s',
                                                    backgroundColor: draggedIndex === index ? '#f3f4f6' : 'transparent',
                                                    padding: '8px',
                                                    borderRadius: '8px'
                                                }}
                                            >
                                                <div style={{ 
                                                    width: 32, 
                                                    height: 32, 
                                                    borderRadius: '50%', 
                                                    backgroundColor: '#e5e7eb', 
                                                    display: 'flex', 
                                                    alignItems: 'center', 
                                                    justifyContent: 'center', 
                                                    fontWeight: 'bold', 
                                                    color: '#4b5563',
                                                    flexShrink: 0,
                                                    marginTop: 4
                                                }}>
                                                    {index + 1}
                                                </div>
                                                <div style={{ flex: 1 }}>
                                                    <div style={{ display: 'flex', gap: 8, marginBottom: 8 }}>
                                                        <Select
                                                            value={stop.type}
                                                            onChange={(val) => handleStopTypeChange(index, val)}
                                                            style={{ width: 110, flexShrink: 0 }}
                                                            size="large"
                                                            variant="filled"
                                                            options={[
                                                                { label: '提货', value: 'pickup' },
                                                                { label: '送货', value: 'delivery' },
                                                                { label: '物流园', value: 'logistics' }
                                                            ]}
                                                        />
                                                        <Select
                                                            showSearch
                                                        placeholder="请选择地址..."
                                                        optionFilterProp="children"
                                                        value={stop.addressId}
                                                        onChange={(val) => handleStopChange(index, val)}
                                                        style={{ flex: 1 }}
                                                        size="large"
                                                        variant="filled"
                                                    >
                                                        {addresses.map(addr => (
                                                            <Select.Option key={addr.id} value={addr.id}>
                                                                {addr.name} - {addr.contactPerson}
                                                            </Select.Option>
                                                        ))}
                                                    </Select>
                                                    </div>
                                                    {stop.addressId && (
                                                        <div style={{ marginTop: 8, fontSize: 12, color: '#6b7280' }}>
                                                            {(() => {
                                                                const addr = addresses.find(a => a.id === stop.addressId);
                                                                return addr ? `${addr.location || ''} ${addr.contactInfo || ''}` : '';
                                                            })()}
                                                        </div>
                                                    )}
                                                </div>
                                                <Button 
                                                    danger 
                                                    type="text" 
                                                    icon={<span style={{fontSize: '1.25rem'}}>×</span>}
                                                    onClick={() => handleRemoveStop(index)}
                                                    style={{ marginTop: 4 }}
                                                    title="删除"
                                                />
                                            </div>
                                        ))
                                    ) : (
                                        <Empty description="暂无站点，请添加" image={Empty.PRESENTED_IMAGE_SIMPLE} />
                                    )}
                                    <Button type="dashed" onClick={handleAddStop} block size="large" icon={<span style={{marginRight: 8}}>+</span>}>
                                        添加站点
                                    </Button>

                                    {activePrecautions.length > 0 && (
                                        <div style={{ marginTop: 16, padding: 16, backgroundColor: '#fffbe6', border: '1px solid #ffe58f', borderRadius: 8 }}>
                                            <div style={{ fontWeight: 'bold', color: '#d46b08', marginBottom: 8, display: 'flex', alignItems: 'center', gap: 8 }}>
                                                <span style={{ fontSize: '1.2rem' }}>⚠️</span> 内部注意事项 (仅内部可见)
                                            </div>
                                            <ul style={{ margin: 0, paddingLeft: 20, color: '#cf1322' }}>
                                                {activePrecautions.map((p, idx) => (
                                                    <li key={idx} style={{ marginBottom: 4 }}><strong>{p.name}:</strong> {p.text}</li>
                                                ))}
                                            </ul>
                                        </div>
                                    )}
                                </div>

                                <Divider orientation="left">货物信息</Divider>
                                <div style={{ display: 'grid', gridTemplateColumns: '3fr 1fr 1fr 1fr', gap: '16px', marginBottom: '16px' }}>
                                    <Form.Item name="cargoDescription" label="货物名称/描述" style={{ marginBottom: 0 }}>
                                        <Input size="large" variant="filled" />
                                    </Form.Item>
                                    <Form.Item name="cargoCount" label="总件数" style={{ marginBottom: 0 }}>
                                        <InputNumber min={0} controls={false} size="large" style={{width: '100%'}} variant="filled" />
                                    </Form.Item>
                                    <Form.Item name="cargoWeight" label="总重量 (KG)" style={{ marginBottom: 0 }}>
                                        <InputNumber min={0} controls={false} size="large" style={{width: '100%'}} variant="filled" />
                                    </Form.Item>
                                    <Form.Item name="cargoCbm" label="总体积 (CBM)" style={{ marginBottom: 0 }}>
                                        <InputNumber min={0} controls={false} size="large" style={{width: '100%'}} variant="filled" />
                                    </Form.Item>
                                </div>
                                <div style={{ display: 'grid', gridTemplateColumns: '1fr', gap: 24 }}>
                                    <div style={{ gridColumn: '1 / -1' }}>
                                        <Form.Item name="note" label="备注信息">
                                            <Input.TextArea rows={4} variant="filled" />
                                        </Form.Item>
                                    </div>
                                </div>

                                <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 16 }}>
                                    {editingOrder ? (
                                        <>
                                            <Button size="large" onClick={onCancelEdit}>取消编辑</Button>
                                            <Button size="large" onClick={handleSaveDraft} icon={React.createElement(icons.SaveOutlined)}>存为草稿</Button>
                                            <Button type="primary" size="large" style={{ boxShadow: '0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05)' }} onClick={handleGenerate}>
                                                {isPreOrder ? '保存预定单' : '保存修改并更新记录'}
                                            </Button>
                                        </>
                                    ) : (
                                        <>
                                            <Button size="large" onClick={handleReset}>重置</Button>
                                            <Button size="large" onClick={handleSaveDraft} icon={React.createElement(icons.SaveOutlined)}>保存草稿</Button>
                                            <Button type="primary" size="large" style={{ boxShadow: '0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05)' }} onClick={handleGenerate}>
                                                {isPreOrder ? '保存预定单' : '确认生成派车单 (PDF)'}
                                            </Button>
                                        </>
                                    )}
                                </div>
                            </div>
                        </Form>
                    </Card>
                </div>
            );
        };

        // 1. 地址库组件
        const AddressLibrary = ({ addresses, setAddresses }) => {
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingId, setEditingId] = useState(null);
            const [form] = Form.useForm();
            const [searchText, setSearchText] = useState('');
            
            // Batch edit state
            const [selectedRowKeys, setSelectedRowKeys] = useState([]);
            const [isBatchModalVisible, setIsBatchModalVisible] = useState(false);
            const [batchForm] = Form.useForm();

            const columns = [
                { title: '名称', dataIndex: 'name', key: 'name', render: t => <Text strong>{t}</Text> },
                { title: '简称', dataIndex: 'shortName', key: 'shortName', width: 110, render: t => t ? <Text strong>{t}</Text> : <Text type="secondary">-</Text> },
                { title: '地址', dataIndex: 'location', key: 'location' },
